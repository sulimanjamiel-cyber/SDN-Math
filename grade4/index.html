/* Layout: a book-like map of 8 lesson "tabs" (yellow tab + green title, like the textbook), then one question card at a time */
/* Colours shared with "Maaz's Maths Quest": light-blue ground, eight bright colours, golden accent */
:root{
  --paper:#EEF6FF; --card:#FFFFFF; --ink:#1A2233; --muted:#55607A; --line:#D3DDEB;
  --c1:#F0505A; --c2:#2F80ED; --c3:#1E9E57; --c4:#8E44D9; --c5:#F2711C; --c6:#E0428C; --c7:#0E9AA7; --c8:#4B5BD6;
  --gc:#2F80ED; --blob1:rgba(255,196,0,.30); --blob2:rgba(47,128,237,.20); --blob3:rgba(224,66,140,.16);
  --yellow:#F2B705; --yellow-soft:#FCEFC2; --yellow-ink:#3A2C00;
  --pink:#E0428C; --blue:#2F80ED; --ok:#1D7F62; --ok-soft:#DCF1E7; --bad:#C2423A; --bad-soft:#FBE4E0;
  --shade:#F6C431; --empty:#FFFFFF;
  --f-display:"Two Sudan","Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --f-body:"Two Sudan","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141F; --card:#1A2030; --ink:#EEF2FA; --muted:#A1ABC2; --line:#323C52;
  --c1:#F25F67; --c2:#4A8FEF; --c3:#2AAE66; --c4:#A266E6; --c5:#F47F2F; --c6:#E5559A; --c7:#1AAAB6; --c8:#6474EA;
  --gc:#4A8FEF; --blob1:rgba(255,196,0,.10); --blob2:rgba(47,128,237,.16); --blob3:rgba(224,66,140,.12);
  --yellow:#F5C434; --yellow-soft:#3A3115; --yellow-ink:#3A2C00;
  --pink:#E5559A; --blue:#4A8FEF; --ok:#45C99D; --ok-soft:#14352A; --bad:#F27D70; --bad-soft:#3D1F1C;
  --shade:#E0AE2A; --empty:#222A3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141F; --card:#1A2030; --ink:#EEF2FA; --muted:#A1ABC2; --line:#323C52;
  --c1:#F25F67; --c2:#4A8FEF; --c3:#2AAE66; --c4:#A266E6; --c5:#F47F2F; --c6:#E5559A; --c7:#1AAAB6; --c8:#6474EA;
  --gc:#4A8FEF; --blob1:rgba(255,196,0,.10); --blob2:rgba(47,128,237,.16); --blob3:rgba(224,66,140,.12);
  --yellow:#F5C434; --yellow-soft:#3A3115; --yellow-ink:#3A2C00;
  --pink:#E5559A; --blue:#4A8FEF; --ok:#45C99D; --ok-soft:#14352A; --bad:#F27D70; --bad-soft:#3D1F1C;
  --shade:#E0AE2A; --empty:#222A3C; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(520px 380px at 0% 0%,var(--blob1),transparent 70%),radial-gradient(520px 420px at 100% 20%,var(--blob2),transparent 70%),radial-gradient(600px 420px at 40% 100%,var(--blob3),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.tab{display:inline-block;background:var(--yellow);color:var(--yellow-ink);font-family:var(--f-display);font-weight:700;
  border-radius:999px 0 0 999px;padding:2px 16px 0;font-size:15px;align-self:flex-start}
h1{font-family:var(--f-display);font-weight:800;color:var(--gc);font-size:clamp(34px,7vw,50px);line-height:1.1;margin:6px 0 0;text-wrap:balance}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px}
.sub{color:var(--muted);margin:0}

/* map */
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 10px;text-align:right;
  display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;min-width:0}
.lesson:hover{transform:translateY(-2px);border-color:var(--gc)}
.lesson .ln{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lesson .tab{font-size:13px;padding:1px 12px 0}
.lesson .pg{color:var(--muted);font-size:13px}
.lesson .nm{font-family:var(--f-display);font-weight:700;color:var(--gc);font-size:19px;line-height:1.25}
.lesson .pie-mini{height:44px}
.stars{letter-spacing:2px;font-size:18px;color:var(--line)}
.stars .on{color:#F5B400}
.lesson.final{grid-column:1/-1;background:var(--gc);border-color:var(--gc);color:#fff}
.lesson.final .nm{color:#fff;font-size:22px}
.lesson.final .pg{color:#E6FFF2}
.lesson.final .tab{background:var(--yellow)}
.lesson.final .stars{color:rgba(255,255,255,.35)}

/* play */
.bar{display:flex;align-items:center;gap:10px}
.back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--card)}
.prog{flex:1;height:12px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gc);border-radius:99px;transition:width .3s}
.count{font-weight:600;min-width:52px;text-align:center}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.qhead .tab{font-size:14px}
.qtype{color:var(--muted);font-size:14px}
.q{font-size:21px;font-weight:600;margin:0;line-height:1.7}
.vis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:18px}
.eq{direction:rtl;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  font-family:var(--f-display);font-size:28px;font-weight:700}
.eqline{display:flex;justify-content:center}

/* fractions: stacked numerator over denominator */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0 3px;direction:rtl}
.fr>b{font-weight:inherit;padding:0 4px}
.fr>i{font-style:normal;border-top:2.5px solid currentColor;padding:0 4px;min-width:1.2em;text-align:center}
.q .fr{font-size:22px}

/* selects */
select.dd{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink);background:var(--yellow);background:color-mix(in srgb,var(--yellow) 35%,var(--card));
  border:2px solid var(--line);border-radius:10px;padding:0 6px;min-width:62px;text-align:center;direction:rtl;height:44px}
.fr select.dd{margin:3px 0}
select.dd.right{border-color:var(--ok);background:var(--ok-soft)}
select.dd.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:15px;color:var(--ok);font-family:var(--f-body);font-weight:600;display:block;text-align:center}

/* mcq */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;direction:rtl;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;text-align:right;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--gc)}
.opt .L{font-family:var(--f-display);font-weight:800;font-size:20px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 14%,var(--card));color:var(--gc);flex:none}
.opt .C{direction:rtl;flex:1;font-size:20px;font-weight:600;display:flex;justify-content:flex-start;align-items:center}
.opt .C .fr{font-size:26px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

/* compare */
.cmp{display:flex;align-items:center;justify-content:center;gap:16px;direction:rtl}
.cmp .fr{font-size:40px}
.slot{width:64px;height:64px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-size:38px;font-weight:800}
.slot.right{border:3px solid var(--ok);background:var(--ok-soft)}
.slot.wrong{border:3px solid var(--bad);background:var(--bad-soft)}
.signs{display:flex;gap:12px;justify-content:center;direction:rtl}
.sign{width:74px;height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:34px;font-weight:800}
.sign:hover:not(:disabled){border-color:var(--gc);background:color-mix(in srgb,var(--gc) 14%,var(--card))}

/* chips (order / match / multi) */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.chip{min-width:72px;min-height:78px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:6px 10px}
.chip .fr{font-size:28px}
.chip.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.chip.used{opacity:.25;pointer-events:none}
.chip.right{border-color:var(--ok);background:var(--ok-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;gap:10px;justify-content:center;direction:rtl;align-items:center;flex-wrap:wrap}
.slots .chip{border-style:dashed}
.slots .arrow{font-family:var(--f-display);font-size:26px;color:var(--muted)}
.dirnote{text-align:center;color:var(--muted);font-weight:600}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;direction:rtl;max-width:360px;margin:0 auto;width:100%}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .chip{width:100%}
.pair1{border-color:var(--ok)!important;background:var(--ok-soft)!important}

/* shapes */
svg.shape{max-width:100%;height:auto;display:block}
svg .part{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
svg.click .part{cursor:pointer}
svg.click .part:hover{opacity:.85}
.shape-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.caption{font-size:15px;color:var(--muted);font-weight:600}
.set{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border:2px solid var(--line);border-radius:16px;padding:10px;max-width:420px;direction:rtl}
.set .grp{display:flex;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:4px}
.item{width:52px;height:52px;display:grid;place-items:center;font-size:36px;border-radius:12px;border:2.5px solid transparent;background:none;padding:0;line-height:1}
.set.small .item{width:38px;height:38px;font-size:26px}
.item.pick{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.item[disabled]{cursor:default}
.counter{text-align:center;font-weight:600;color:var(--muted)}
.wall{width:100%;max-width:440px;direction:rtl;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.wall .row{display:flex}
.wall .cell{flex:1;border:1px solid var(--ink);display:grid;place-items:center;padding:3px 0;background:var(--card)}
.wall .cell .fr{font-size:15px}
.wall .row:nth-child(1) .cell{background:color-mix(in srgb,var(--yellow) 45%,var(--card))}
.wall .row:nth-child(2) .cell{background:color-mix(in srgb,var(--gc) 22%,var(--card))}
.wall .row:nth-child(3) .cell{background:color-mix(in srgb,var(--blue) 18%,var(--card))}
.wall .row:nth-child(4) .cell{background:color-mix(in srgb,var(--pink) 16%,var(--card))}

/* feedback */
.fb{border-radius:14px;padding:12px 16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .tip{color:var(--ink);font-weight:500;display:block}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--gc);color:#fff;border:none;border-radius:999px;padding:10px 30px;font-weight:700;font-size:19px;font-family:var(--f-display)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--card);color:var(--gc);border:2px solid var(--gc)}

/* result */
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:64px;font-weight:800;color:var(--gc);line-height:1;direction:rtl}
.result .stars{font-size:44px}
.result h2{font-family:var(--f-display);font-size:30px;margin:0;color:var(--ink)}

@media (max-width:480px){
  body{font-size:16px}
  .card{padding:16px}
  .q{font-size:19px}
  .eq{font-size:24px}
  .cmp .fr{font-size:34px}
  .sign{width:64px}
}
/* clock + words */
:root{--hourhand:#D9342B;--minhand:#1F3F8F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hourhand:#FF6B5E;--minhand:#8FB0FF}}
:root[data-theme="dark"]{--hourhand:#FF6B5E;--minhand:#8FB0FF}
svg.clock .cnum{font-family:var(--f-display);font-weight:700;font-size:20px;fill:var(--ink)}
svg.clock.click{cursor:pointer;touch-action:manipulation}
.lesson .pie-mini{height:52px}
.word{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3;padding:0 4px}
.cmp .word{font-size:32px}
.handbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600}
.hb[data-h="h"].on{border-color:var(--hourhand);background:color-mix(in srgb,var(--hourhand) 14%,var(--card))}
.hb[data-h="m"].on{border-color:var(--minhand);background:color-mix(in srgb,var(--minhand) 14%,var(--card))}
.hb .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* unit cards on the home screen */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
@media (max-width:560px){.units{grid-template-columns:1fr}}
.unit{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;text-align:right;transition:transform .15s,border-color .15s;min-width:0}
.unit:hover{transform:translateY(-2px);border-color:var(--gc)}
.unit .uicon{flex:none}
.unit .ubody{display:flex;flex-direction:column;gap:4px;min-width:0}
.unit .nm{font-family:var(--f-display);font-weight:800;color:var(--gc);font-size:30px;line-height:1.2}
.unit .tab{font-size:14px}
.unit .pg{color:var(--muted);font-size:14px}
.bar .sub{font-weight:600}
/* interactive activities */
.card.fx-ok{animation:bounce .45s}
.card.fx-no{animation:shake .35s}
@keyframes bounce{40%{transform:scale(1.02)}70%{transform:scale(.995)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.streak{font-weight:700;color:#E8590C;background:color-mix(in srgb,#FF8A3D 18%,var(--card));border-radius:999px;padding:2px 10px;white-space:nowrap}
.part.pop-in{animation:popin .25s}
@keyframes popin{50%{opacity:.6}}
.steppers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stepper{display:flex;flex-direction:column;align-items:center;gap:6px;background:color-mix(in srgb,var(--gc) 14%,var(--card));border-radius:16px;padding:10px 14px}
.slabel{font-weight:600;font-size:15px}
.srow{display:flex;align-items:center;gap:12px}
.sbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--gc);background:var(--card);color:var(--gc);font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.sbtn:active{transform:scale(.92)}
.sval{font-family:var(--f-display);font-size:34px;font-weight:800;min-width:40px;text-align:center}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const F = (n,d)=>`<span class="fr"><b>${n}</b><i>${d}</i></span>`;
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------- sound ---------- */
let soundOn = store.get("g3-sound",true), actx=null;
function beep(good){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good? [523,659,784] : [330,247];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = good? "triangle":"sine"; o.frequency.value=f;
      const t=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}
function paintSound(){const b=$("#soundBtn");b.textContent= soundOn?"الصوت: يعمل":"الصوت: متوقف";b.setAttribute("aria-pressed",soundOn);}
$("#soundBtn").addEventListener("click",()=>{soundOn=!soundOn;store.set("g3-sound",soundOn);paintSound();});
paintSound();

/* ---------- shapes ---------- */
const COL={shade:"var(--shade)",pink:"var(--pink)",blue:"var(--blue)",green:"var(--gc)",empty:"var(--empty)"};
// shaded: array of colour keys per part (or null)
function pie(n,shaded=[],opt={}){
  const size=opt.size||170, r=size/2-4, cx=size/2, cy=size/2;
  let s="";
  for(let i=0;i<n;i++){
    const fill=COL[shaded[i]]||COL.empty;
    if(n===1){s+=`<circle class="part" data-i="0" cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`;continue;}
    const a0=-Math.PI/2+i*2*Math.PI/n, a1=a0+2*Math.PI/n;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    s+=`<path class="part" data-i="${i}" d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}"/>`;
  }
  return `<svg class="shape${opt.click?" click":""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="دائرة مقسمة إلى ${n} أجزاء">${s}</svg>`;
}
function bar(n,shaded=[],opt={}){
  const w=opt.w||Math.min(380,n*56), h=opt.h||70, pw=(w-4)/n; let s="";
  for(let i=0;i<n;i++){const fill=COL[shaded[i]]||COL.empty;
    s+=`<rect class="part" data-i="${i}" x="${(2+i*pw).toFixed(2)}" y="2" width="${pw.toFixed(2)}" height="${h-4}" fill="${fill}"/>`;}
  return `<svg class="shape${opt.click?" click":""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="شريط مقسم إلى ${n} أجزاء">${s}</svg>`;
}
function grid(r,c,shaded=[],opt={}){
  const cw=opt.cell||54, w=c*cw+4, h=r*cw+4; let s="",k=0;
  for(let y=0;y<r;y++)for(let x=0;x<c;x++,k++){const fill=COL[shaded[k]]||COL.empty;
    s+=`<rect class="part" data-i="${k}" x="${2+x*cw}" y="${2+y*cw}" width="${cw}" height="${cw}" fill="${fill}"/>`;}
  return `<svg class="shape${opt.click?" click":""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="مستطيل مقسم إلى ${r*c} أجزاء">${s}</svg>`;
}
const sh=(k,c="shade")=>Array(k).fill(c);
function fish(color){
  return `<svg width="44" height="30" viewBox="0 0 44 30" aria-hidden="true"><path d="M30 15 L43 5 L43 25 Z" fill="${color}" stroke="#1C2A22" stroke-width="1.5"/><ellipse cx="18" cy="15" rx="17" ry="11" fill="${color}" stroke="#1C2A22" stroke-width="1.5"/><circle cx="9" cy="12" r="2.6" fill="#fff"/><circle cx="8.6" cy="12" r="1.3" fill="#1C2A22"/></svg>`;
}
const FISH={red:fish("#F2662B"),green:fish("#3BB54A"),blue:fish("#5A8FE0")};
// items: array of strings (emoji or svg); groups: optional number of boxes
function setVis(items,opt={}){
  const cls="set"+(opt.small?" small":"");
  const btn=(it,i)=> opt.click? `<button class="item" data-i="${i}" aria-label="عنصر ${i+1}">${it}</button>` : `<span class="item">${it}</span>`;
  if(opt.groups){
    const per=items.length/opt.groups; let s="";
    for(let g=0;g<opt.groups;g++) s+=`<div class="grp">${items.slice(g*per,(g+1)*per).map((it,j)=>btn(it,g*per+j)).join("")}</div>`;
    return `<div class="${cls}">${s}</div>`;
  }
  return `<div class="${cls}">${items.map(btn).join("")}</div>`;
}
const rep=(it,n)=>Array(n).fill(it);
function wall(dens){
  return `<div class="wall">${dens.map(d=>`<div class="row">${range(1,d).map(()=>`<div class="cell">${d===1?'<b style="font-family:var(--f-display)">1</b>':F(1,d)}</div>`).join("")}</div>`).join("")}</div>`;
}
const cap=(html,c)=>`<div class="shape-wrap">${html}<span class="caption">${c}</span></div>`;

/* ================= Unit 6: geometry (book pp. 81–113) ================= */
const vsub=(p,q)=>[p[0]-q[0],p[1]-q[1]], vlen=v=>Math.hypot(v[0],v[1]), vdot=(a,b)=>a[0]*b[0]+a[1]*b[1], same=(p,q)=>p[0]===q[0]&&p[1]===q[1];
// right triangle with the right angle at V: |VA| = la, |VB| = lb
const RTRI=(V,A,B,la,lb)=>P=>{ const u=vsub(P[A],P[V]), w=vsub(P[B],P[V]);
  if(Math.abs(vlen(u)-la)>1e-9) return `طول ${LETS(V+A)} يجب أن يكون ${la} سم.`;
  if(Math.abs(vlen(w)-lb)>1e-9) return `طول ${LETS(V+B)} يجب أن يكون ${lb} سم.`;
  if(vdot(u,w)!==0) return `الزاوية عند ${V} يجب أن تكون قائمة.`; return true; };
// rectangle / square A B C D with A, B fixed: |BC| = h, BC ⟂ AB, D = A + (C − B)
const RECT=(A,B,C,D,h)=>P=>{ const ab=vsub(P[B],P[A]), bc=vsub(P[C],P[B]);
  if(vdot(ab,bc)!==0) return `الزاوية عند ${B} يجب أن تكون قائمة.`;
  if(Math.abs(vlen(bc)-h)>1e-9) return `طول ${LETS(B+C)} يجب أن يكون ${h} سم.`;
  if(!same(P[D],[P[A][0]+bc[0],P[A][1]+bc[1]])) return `${D} يجب أن تكون مقابل ${C} بحيث يكون ${LETS(A+D)} موازياً ومساوياً لـ ${LETS(B+C)}.`; return true; };
const PARA=(A,B,C,D)=>P=>same(P[D],[P[A][0]+P[C][0]-P[B][0],P[A][1]+P[C][1]-P[B][1]])||"في متوازي الأضلاع كل ضلعين متقابلين متوازيان ومتساويان. عُدّ النقاط من ج كما تعدّها من ب إلى أ.";
const onC=(d,c=[160,118],r=88)=>[+(c[0]+r*Math.cos(d*Math.PI/180)).toFixed(1), +(c[1]-r*Math.sin(d*Math.PI/180)).toFixed(1)];
const PCIR={"م":[160,118],"ج":onC(160),"د":onC(-20),"أ":onC(75),"ب":onC(15),"هـ":onC(245)};

function starsFor(p){return p>=0.9?3:p>=0.7?2:p>=0.4?1:0;}
function starStr(n){return [0,1,2].map(i=>`<span class="${i<n?"on":""}">★</span>`).join("");}
const unitStars=u=>[...u.L,u.FINAL].reduce((s,l)=>s+(best[u.key+"-"+l.id]||0),0);
const unitMax=u=>(u.L.length+1)*3;
function updateTotal(){
  const t=UNITS.reduce((s,u)=>s+unitStars(u),0), m=UNITS.reduce((s,u)=>s+unitMax(u),0);
  $("#totalStars").textContent=`${t} / ${m}`;
}
const PG=p=>{const [a,b]=p.split("–"); return b? `من صفحة ${a} إلى ${b}` : `صفحة ${a}`;};
const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر"];

function start(id){
  let lesson, list;
  if(id===FINAL.id){ lesson=FINAL; list=shuffle(UNIT.pick(L)); }
  else { lesson=L.find(l=>l.id===id); list=lesson.qs.map(q=>({...q,_l:id-1})); }
  setGC(id===FINAL.id? UNIT.col : LC(id-1));
  S={lesson,list,i:0,score:0,streak:0};
  renderQ();
  window.scrollTo({top:0,behavior:"smooth"});
}


/* ---------- question rendering ---------- */
const LET=["أ","ب","ج","د"];
const D=x=> Array.isArray(x)? F(...x) : x.h? x.h : `<span class="word">${x.l}</span>`;
const VAL=x=> Array.isArray(x)? x[0]/x[1] : x.v;
// logical relation "right REL left" -> glyph drawn so its point faces the smaller fraction, as in the book
const VIS=s=> s==="<"?">":s===">"?"<":s;
const G=s=>`<bdi dir="ltr">${VIS(s)}</bdi>`;
const PRAISE=["أحسنت!","ممتاز!","رائع!","إجابة صحيحة!","بطل الرياضيات!"];
const TYPE={sieve:"غربال الأعداد",ladder:"التحليل إلى العوامل",common:"المشترك",ynt:"جدول نعم أو لا",pour:"املأ الإناء",place:"خط الأعداد",ratio:"اصنع النسبة",protr:"المنقلة",geo:"لوحة النقاط",compass:"الفرجار",tappt:"اختر النقطة",abacus:"العدّاد",column:"الحساب الرأسي",longdiv:"القسمة المطوّلة",groups:"اصنع المجموعات",share:"وزّع بالتساوي",opsign:"ضع العلامة",race:"سباق",connect:"صِل النقاط",tapseg:"اختر القطعة",measure:"قِس بالمسطرة",classify:"صنّف الأشكال",pop:"فرقع البالونات",build:"اصنع الكسر",jump:"خط الأعداد",setclock:"حرّك الشوكتين",mcq:"اختيار من متعدد",color:"لوّن",set:"احصر",fill:"أكمل",cmp:"قارن",order:"رتّب",match:"صِل",multi:"اختر الكل"};

function renderQ(){
  const q=S.list[S.i], n=S.list.length;
  const li=q._l; S.wrong=0;
  $("#view").innerHTML=`
    <div class="bar">
      <button class="back" id="backBtn">→ الدروس</button>

  $("#backBtn").addEventListener("click",showMap);

  if(q.vis) body.insertAdjacentHTML("beforeend",`<div class="vis">${q.vis}</div>`);
  R[q.t](q,body);

/* ---------- drag helper: tap = onTap, drag = onDrop(x,y) ---------- */
function dragify(el,onTap,onDrop){
  el.style.touchAction="none";
  el.addEventListener("pointerdown",e=>{
    const sx=e.clientX, sy=e.clientY; let ghost=null;
    const move=ev=>{ const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!ghost && Math.hypot(dx,dy)>8){ ghost=el.cloneNode(true); ghost.classList.add("dragghost"); const r=el.getBoundingClientRect();
        ghost.style.width=r.width+"px"; ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px"; document.body.appendChild(ghost); el.classList.add("lifting"); }
      if(ghost){ const r=el.getBoundingClientRect(); ghost.style.transform=`translate(${dx}px,${dy}px) rotate(-3deg)`; } };
    const up=ev=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
      if(ghost){ ghost.remove(); el.classList.remove("lifting"); if(!onDrop(ev.clientX,ev.clientY)){} } else onTap(); };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  });
}
/* ---------- celebration ---------- */
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(RM) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const w=c.width=innerWidth, h=c.height=innerHeight, x=c.getContext("2d");
  const cols=["#FFD60A","#0B8A52","#E0457B","#2D6FD6","#FF8A3D","#A86EF0"];
  const ps=Array.from({length:90},()=>({x:w/2+(Math.random()-.5)*120,y:h*0.45,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*7+5,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,w,h); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.r+=0.2; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<70) requestAnimationFrame(f); else c.remove(); })();
}
function cardFx(cls){ const c=$(".card"); if(!c||RM) return; c.classList.remove("fx-ok","fx-no"); void c.offsetWidth; c.classList.add(cls); }
function paintStreak(){ const s=$("#streak"); if(!s) return; s.hidden=!(S.streak>=2); s.innerHTML=`🔥 <span>${S.streak}</span> متتالية`; }

const AGAIN=["حاول مرة أخرى","فكّر جيداً وحاول مرة أخرى","اقتربت! حاول مرة أخرى"];
// wrong answer: never show the answer, let the pupil try again
function wrong(hint=""){
  S.wrong++; beep(false); S.streak=0; paintStreak(); cardFx("fx-no");
  $("#fb").innerHTML=`<div class="fb no"><span>✗</span><span>${AGAIN[Math.min(S.wrong-1,AGAIN.length-1)]}${hint?`<span class="tip">${hint}</span>`:""}</span></div>`;
}
// right answer: point only if it was right from the first try
function correct(q,note=""){
  if(S.wrong===0){ S.score++; S.streak=(S.streak||0)+1; } 
  beep(true); confetti(); cardFx("fx-ok"); paintStreak();
  if(S.streak>=3 && S.wrong===0) note=`${S.streak} إجابات صحيحة متتالية! `+note;
  const tip = q.tip? `<span class="tip">${q.tip}</span>`:"";
  const extra = S.wrong>0? `<span class="tip">وصلت إلى الإجابة الصحيحة بعد ${S.wrong+1} محاولات.</span>`:"";
  $("#fb").innerHTML=`<div class="fb ok"><span>✓</span><span>${PRAISE[Math.floor(Math.random()*PRAISE.length)]} ${note}${extra}${tip}</span></div>`;
  const last = S.i===S.list.length-1;
  $("#acts").innerHTML=`<button class="btn" id="nextBtn">${last?"النتيجة":"التالي ←"}</button>`;
  $("#nextBtn").addEventListener("click",()=>{ if(last) showResult(); else {S.i++;renderQ();} });
  $("#nextBtn").focus({preventScroll:true});
}
function checkBtn(onCheck,enabled=true){
  $("#acts").innerHTML=`<button class="btn" id="chk"${enabled?"":" disabled"}>تحقّق</button>`;
  $("#chk").addEventListener("click",onCheck);
  return $("#chk");
}

const R={
  mcq(q,body){
    const order=shuffle(q.opts.map((o,i)=>i));
    body.insertAdjacentHTML("beforeend",`<div class="opts">${order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="L">${LET[k]}</span><span class="C">${q.opts[oi]}</span></button>`).join("")}</div>`);
    body.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(+b.dataset.oi===q.a){
        b.classList.add("right"); body.querySelectorAll(".opt").forEach(x=>x.disabled=true); correct(q);
      } else { b.classList.add("wrong"); b.disabled=true; wrong(); }
    }));
  },
  color(q,body){
    // tap or drag across the parts to paint them
    const st=Array(q.n).fill(false); let locked=false, painting=null;
    const svgHtml= q.shape==="pie"? pie(q.n,[],{click:true,size:230}) : bar(q.n,[],{click:true});
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="cv">${svgHtml}</div><div class="counter" id="cc">عدد الأجزاء الملوّنة: 0</div>
      <div class="dirnote" style="font-weight:400">اضغط على الأجزاء أو اسحب إصبعك فوقها لتلوينها.</div>`);
    const parts=[...body.querySelectorAll("#cv .part")];
    const btn=checkBtn(check,false);
    const setPart=(i,v)=>{ if(locked||st[i]===v) return; st[i]=v; parts[i].setAttribute("fill", v?"var(--shade)":"var(--empty)");
      parts[i].classList.toggle("pop-in",v); const k=st.filter(Boolean).length; $("#cc").textContent=`عدد الأجزاء الملوّنة: ${k}`; btn.disabled=k===0; };
    const partAt=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY); return el&&el.classList.contains("part")&&parts.includes(el)? +el.dataset.i : null; };
    const svg=$("#cv svg"); svg.style.touchAction="none";
    svg.addEventListener("pointerdown",e=>{ const i=partAt(e); if(i==null) return; painting=!st[i]; setPart(i,painting); e.preventDefault(); });
    window.addEventListener("pointermove",e=>{ if(painting==null) return; const i=partAt(e); if(i!=null) setPart(i,painting); });
    window.addEventListener("pointerup",()=>{ painting=null; });
    function check(){
      const k=st.filter(Boolean).length;
      if(k===q.need){ locked=true; svg.classList.remove("click"); correct(q); }
      else wrong("تذكّر: البسط يخبرك كم جزءاً تلوّن، والمقام عدد الأجزاء كلها.");
    }
  },
  build(q,body){
    // build a fraction: choose the number of equal parts (denominator) and the shaded parts (numerator)
    const st={d:1,n:0}; let locked=false;
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="bv"></div>
      <div class="steppers">
        <div class="stepper"><span class="slabel">الأجزاء الملوّنة (البسط)</span>
          <div class="srow"><button class="sbtn" data-k="n" data-d="1" aria-label="زِد البسط">+</button><span class="sval" id="sn">0</span><button class="sbtn" data-k="n" data-d="-1" aria-label="أنقص البسط">−</button></div></div>
        <div class="stepper"><span class="slabel">عدد الأجزاء المتطابقة (المقام)</span>
          <div class="srow"><button class="sbtn" data-k="d" data-d="1" aria-label="زِد المقام">+</button><span class="sval" id="sd">1</span><button class="sbtn" data-k="d" data-d="-1" aria-label="أنقص المقام">−</button></div></div>
      </div>`);
    const btn=checkBtn(check,true);
    function paint(){
      $("#bv").innerHTML=cap(pie(st.d,sh(st.n),{size:210}), F(st.n,st.d));
      $("#sn").textContent=st.n; $("#sd").textContent=st.d;
    }
    body.querySelectorAll(".sbtn").forEach(b=>b.addEventListener("click",()=>{ if(locked) return;
      const k=b.dataset.k, d=+b.dataset.d;
      if(k==="d"){ st.d=Math.min(12,Math.max(1,st.d+d)); st.n=Math.min(st.n,st.d); }
      else st.n=Math.min(st.d,Math.max(0,st.n+d));
      paint(); }));
    function check(){
      const okD=st.d===q.d, okN=st.n===q.n;
      if(okD&&okN){ locked=true; body.querySelectorAll(".sbtn").forEach(b=>b.disabled=true); correct(q); }
      else wrong(!okD? "عدد الأجزاء المتطابقة (المقام) يحتاج إلى تصحيح." : "عدد الأجزاء الملوّنة (البسط) يحتاج إلى تصحيح.");
    }
    paint();
  },
  jump(q,body){
    // number line from 0 to 1, as in the book; pupil taps where the answer lands
    const den=q.den, ans=q.start+q.add, W0=520, pad=28, H=190, base=105, step=(W0-2*pad)/den;
    const X=k=>pad+k*step;
    const arc=(a,b,col,lab)=>{ const x1=X(a),x2=X(b),mx=(x1+x2)/2, h=Math.min(60,18+Math.abs(b-a)*10);
      return `<path d="M${x1},${base} Q${mx},${base-h*1.6} ${x2},${base}" fill="none" stroke="${col}" stroke-width="3"/>
        <polygon points="${x2},${base} ${x2+(b>a?-9:9)},${base-12} ${x2+(b>a?-1:1)},${base-14}" fill="${col}"/>
        <text x="${mx}" y="${base-h*0.9-14}" text-anchor="middle" class="jl">${lab}</text>`; };
    function draw(extra=""){
      let s=`<line x1="${pad-8}" y1="${base}" x2="${W0-pad+14}" y2="${base}" stroke="var(--ink)" stroke-width="2.5"/>`;
      for(let k=0;k<=den;k++){ const x=X(k);
        s+=`<line x1="${x}" y1="${base-8}" x2="${x}" y2="${base+8}" stroke="var(--ink)" stroke-width="2"/>`;
        s+= k===0? `<text x="${x}" y="${base+42}" text-anchor="middle" class="tl">0</text>` : k===den? `<text x="${x}" y="${base+42}" text-anchor="middle" class="tl">1</text>`
          : `<text x="${x}" y="${base+32}" text-anchor="middle" class="tl s">${k}</text><line x1="${x-10}" y1="${base+39}" x2="${x+10}" y2="${base+39}" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="${base+60}" text-anchor="middle" class="tl s">${den}</text>`;
        s+=`<rect class="hit" data-k="${k}" x="${x-step/2}" y="${base-45}" width="${step}" height="115" fill="transparent"/>`; }
      s+=arc(0,q.start,"var(--pink)",`${q.start}/${den}`)+extra;
      return `<svg class="shape nline" viewBox="0 0 ${W0} ${H}" width="${W0}" style="max-width:100%;height:auto" role="img" aria-label="خط الأعداد">${s}</svg>`;
    }
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="jv" style="direction:ltr">${draw()}</div><div class="dirnote" style="font-weight:400">${q.add>0?"قفز السهم إلى":"نبدأ من"} ${F(q.start,den)}. اضغط على المكان الذي ${q.add>0?"تصل إليه بعد القفزة الثانية":"تصل إليه بعد الرجوع"}.</div>`);
    $("#acts").innerHTML="";
    let locked=false;
    function bind(){ body.querySelectorAll("#jv .hit").forEach(r=>r.addEventListener("click",()=>{ if(locked) return; const k=+r.dataset.k;
      if(k===ans){ locked=true; $("#jv").innerHTML=draw(arc(q.start,ans,"var(--blue)",`${Math.abs(q.add)}/${den}`)+`<circle cx="${X(ans)}" cy="${base}" r="11" fill="var(--ok)"/>`); correct(q); }
      else { $("#jv").innerHTML=draw(`<circle cx="${X(k)}" cy="${base}" r="11" fill="var(--bad)"/>`); bind();
        wrong(q.add>0? `القفزة الثانية طولها ${Math.abs(q.add)} أجزاء. عُدّ الأجزاء من ${q.start}.` : `نرجع ${Math.abs(q.add)} أجزاء. عُدّ الأجزاء إلى الخلف.`); } })); }
    bind();
  },
  pop(q,body){
    // balloons: pop every balloon that matches the rule
    const items=shuffle(q.items.map((x,i)=>i)); let left=q.items.filter(x=>x.ok).length;
    const COLS=["#F05D7A","#4C8DF0","#F6B92B","#3CC283","#A86EF0","#FF8A3D"];
    body.insertAdjacentHTML("beforeend",`<div class="pond" id="pond">${items.map((i,k)=>`
      <button class="balloon" data-i="${i}" style="--c:${COLS[k%COLS.length]};--d:${(k%5)*0.45}s"><span class="bl">${D(q.items[i].x)}</span><span class="str"></span></button>`).join("")}</div>
      <div class="counter" id="cc">بقي ${left} بالونات</div>`);
    $("#acts").innerHTML="";
    body.querySelectorAll(".balloon").forEach(b=>b.addEventListener("click",()=>{
      const it=q.items[+b.dataset.i];
      if(it.ok){ b.classList.add("popped"); b.disabled=true; left--; $("#cc").textContent= left? `بقي ${left} ${left===1?"بالون":"بالونات"}` : "أحسنت! فرقعت كل البالونات";
        if(left===0) correct(q); else beep(true); }
      else { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); wrong(q.hint||""); }
    }));
  },
  set(q,body){
    const st=Array(q.items.length).fill(false);
    body.insertAdjacentHTML("beforeend",`<div class="vis">${setVis(q.items,{click:true})}</div><div class="counter" id="cc">اخترت: 0</div>`);
    const btn=checkBtn(()=>{
      const k=st.filter(Boolean).length;
      if(k===q.need){ body.querySelectorAll(".item").forEach(b=>b.disabled=true); correct(q); }
      else wrong("تذكّر: المقام عدد العناصر كلها، والبسط عدد العناصر التي تختارها.");
    },false);
    body.querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.i; st[i]=!st[i]; b.classList.toggle("pick",st[i]);
      const k=st.filter(Boolean).length; $("#cc").textContent=`اخترت: ${k}`; btn.disabled=k===0;
    }));
  },
  fill(q,body){
    let html=q.expr;
    q.ans.forEach((a,k)=>{
      const opts=(q.opts&&q.opts[k])||range(0,12);
      html=html.replace(`{${k}}`,`<select class="dd" id="dd${k}" aria-label="الفراغ ${k+1}"><option value="">?</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>`);
    });
    body.insertAdjacentHTML("beforeend",`<div class="eqline"><span class="eq"${q.rtlExpr?' style="direction:rtl"':""}>${html}</span></div>`);
    const sels=q.ans.map((a,k)=>$("#dd"+k,body));
    const btn=checkBtn(()=>{
      let ok=true;
      sels.forEach((s,k)=>{const r=+s.value===q.ans[k]; s.classList.toggle("wrong",!r); if(!r) ok=false;});
      if(ok){ sels.forEach(s=>{s.disabled=true;s.classList.add("right");}); correct(q); }
      else wrong(sels.length>1?"الفراغ الملوّن بالأحمر يحتاج إلى تصحيح.":"");
    },false);
    sels.forEach(s=>s.addEventListener("change",()=>{s.classList.remove("wrong");btn.disabled=sels.some(x=>x.value==="");}));
  },
  cmp(q,body){
    const signs=q.signs||["<","=",">"];
    const v=VAL(q.a)-VAL(q.b);

  ynt(q,body){
    const st=q.rows.map(r=>r[1].map(()=>null));
    body.insertAdjacentHTML("beforeend",`<div class="vis"><table class="ynt"><tr><th>${q.corner||""}</th>${q.cols.map(c=>`<th>${c}</th>`).join("")}</tr>
      ${q.rows.map((r,i)=>`<tr><th>${r[0]}</th>${r[1].map((v,j)=>`<td><button class="yn" data-i="${i}" data-j="${j}">؟</button></td>`).join("")}</tr>`).join("")}</table></div>
      <div class="counter">اضغط على الخانة لتكتب نعم أو لا.</div>`);
    const btn=checkBtn(()=>{
      let ok=true; body.querySelectorAll(".yn").forEach(b=>{ const i=+b.dataset.i,j=+b.dataset.j, r=st[i][j]===q.rows[i][1][j]; b.classList.toggle("wrong",!r); if(!r) ok=false; });
      if(ok){ body.querySelectorAll(".yn").forEach(b=>{b.disabled=true;b.classList.add("right");}); correct(q); }
      else wrong(q.hint||"الخانات الملوّنة بالأحمر تحتاج إلى تصحيح.");
    },false);
    body.querySelectorAll(".yn").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.i,j=+b.dataset.j;
      st[i][j]= st[i][j]===null? true : st[i][j]? false : true; b.textContent=st[i][j]?"نعم":"لا"; b.classList.remove("wrong"); b.classList.toggle("yes",st[i][j]); b.classList.toggle("no",!st[i][j]);
      btn.disabled=st.some(r=>r.some(v=>v===null)); }));
  },
  /* pour into a graduated jug / syringe */
  pour(q,body){
    const max=q.max, top=30, bot=270, hgt=bot-top, stp=hgt/max, syr=q.kind==="syringe"; let lv=0, locked=false, drag=false;
    const x0=syr?95:55, x1=syr?135:165;
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="pv"></div>
      <div class="nudge"><button class="sbtn" id="pm" aria-label="أنقص">−</button><span class="dirnote" style="font-weight:400">اسحب داخل الإناء أو استعمل الزرين</span><button class="sbtn" id="pp" aria-label="زِد">+</button></div>`);
    const btn=checkBtn(check,false);
    function draw(){
      let s="";
      const mid=(x0+x1)/2, sy=bot-lv*stp;
      if(syr) s+=`<rect x="${mid-4}" y="${top-34}" width="8" height="${sy-(top-34)}" fill="#AEB5BC"/><rect x="${x0-12}" y="${top-40}" width="${x1-x0+24}" height="7" rx="3" fill="#7D858D"/>
        <polygon points="${mid-6},${bot} ${mid+6},${bot} ${mid+2},${bot+16} ${mid-2},${bot+16}" fill="#9AA2AA"/><line x1="${mid}" y1="${bot+16}" x2="${mid}" y2="${bot+44}" stroke="#6F777F" stroke-width="2"/>`;
      s+=`<rect x="${x0}" y="${bot-lv*stp}" width="${x1-x0}" height="${lv*stp}" fill="${q.liq||"#5DB7F0"}" opacity=".85"/>`;
      if(syr) s+=`<rect x="${x0+2}" y="${sy-8}" width="${x1-x0-4}" height="8" fill="#39424B"/>`;
      if(!syr) s+=`<path d="M${x1},${top+8} q26,6 22,40 q-4,30 -22,44" fill="none" stroke="var(--ink)" stroke-width="5"/>`;
      s+=`<rect x="${x0}" y="${top}" width="${x1-x0}" height="${hgt}" rx="${syr?6:10}" fill="none" stroke="var(--ink)" stroke-width="3"/>`;
      for(let i=1;i<=max;i++){ const y=bot-i*stp; s+=`<line x1="${x0}" y1="${y}" x2="${x0+(i===max||q.big&&i%q.big===0?26:16)}" y2="${y}" stroke="var(--ink)" stroke-width="2"/>`;
        if(!q.every||i%q.every===0) s+=`<text x="${x0-8}" y="${y+6}" text-anchor="start" class="pmark">${q.lab(i)}</text>`; }
      $("#pv").innerHTML=`<svg class="shape" id="psvg" viewBox="-40 -20 ${syr?260:240} 340" width="${syr?260:240}" style="max-width:100%;height:auto;touch-action:none" role="img" aria-label="إناء مدرّج">${s}</svg>`;
      btn.disabled=locked||lv===0;
    }
    const lvAt=e=>{ const r=$("#psvg").getBoundingClientRect(), y=(e.clientY-r.top)*340/r.height-20; return Math.max(0,Math.min(max,Math.round((bot-y)/stp))); };
    const set=v=>{ if(locked) return; if(v!==lv){ lv=v; draw(); } };
    $("#pv").addEventListener("pointerdown",e=>{ if(locked) return; drag=true; set(lvAt(e)); e.preventDefault(); });
    window.addEventListener("pointermove",e=>{ if(drag) set(lvAt(e)); });
    window.addEventListener("pointerup",()=>{ drag=false; });
    $("#pp").addEventListener("click",()=>set(Math.min(max,lv+1))); $("#pm").addEventListener("click",()=>set(Math.max(0,lv-1)));
    function check(){ if(lv===q.target){ locked=true; $("#pp").disabled=$("#pm").disabled=true; draw(); correct(q); } else wrong(q.hint||(lv>q.target?"الكمية أكثر من المطلوب.":"الكمية أقل من المطلوب.")); }
    draw();
  },
  /* place fractions on a number line */
  place(q,body){
    const den=q.den, max=q.max||1; let idx=0; const done={};
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="nv" style="direction:ltr"></div><div class="counter" id="cc"></div>`);
    $("#acts").innerHTML="";
    function ask(){ const a=q.ask[idx]; $("#cc").innerHTML= a.lab? `ضع الحرف <b>${a.lab}</b> على النقطة التي تمثل الكسر ${F(a.n,den)}` : `اضغط على النقطة التي تمثل الكسر ${F(a.n,den)}`; }
    function draw(bad){ const m={...done}; $("#nv").innerHTML=NL(den,max,m,{hit:true}).replace("</svg>",bad!=null?`<circle cx="${30+bad*(460/(den*max))}" cy="70" r="9" fill="var(--bad)"/></svg>`:"</svg>");
      $("#nv").querySelectorAll(".hit").forEach(r=>r.addEventListener("click",()=>tap(+r.dataset.k))); }
    function tap(k){ if(idx>=q.ask.length) return; const a=q.ask[idx];
      if(k===a.n){ done[k]=a.lab||`${a.n}/${den}`; idx++; draw(); $("#fb").innerHTML="";
        if(idx===q.ask.length){ $("#cc").textContent="أحسنت!"; correct(q); } else { beep(true); ask(); } }
      else { draw(k); wrong(`قسّم المسافة بين ٠ و ١ إلى ${den} أجزاء متساوية، ثم عُدّ ${a.n} من الصفر.`); } }
    draw(); ask();
  },
  /* make a ratio with two kinds of counters */
  ratio(q,body){
    const st=[0,0], mx=q.mx||20; let locked=false;
    body.insertAdjacentHTML("beforeend",`<div class="rboxes">${[0,1].map(i=>`<div class="rbox"><span class="slabel">${[q.la,q.lb][i]}</span><div class="rpile" id="rp${i}"></div>
      <div class="srow"><button class="sbtn" data-i="${i}" data-d="1" aria-label="زِد">+</button><span class="sval" id="rv${i}">0</span><button class="sbtn" data-i="${i}" data-d="-1" aria-label="أنقص">−</button></div></div>`).join("")}</div>
      <div class="counter" id="rr"></div>`);
    const btn=checkBtn(check,false);
    function paint(){ [0,1].forEach(i=>{ $("#rp"+i).innerHTML=rep(`<span>${[q.ea,q.eb][i]}</span>`,st[i]).join(""); $("#rv"+i).textContent=st[i]; });
      $("#rr").innerHTML=`النسبة = ${RAT(st[0],st[1])}${q.total?` &nbsp;·&nbsp; المجموع = ${st[0]+st[1]}`:""}`; btn.disabled=locked||!st[0]||!st[1]; }
    body.querySelectorAll(".sbtn").forEach(b=>b.addEventListener("click",()=>{ if(locked) return; const i=+b.dataset.i; st[i]=Math.max(0,Math.min(mx,st[i]+ +b.dataset.d)); paint(); }));
    function check(){ const ok=st[0]*q.b===st[1]*q.a && (!q.total||st[0]+st[1]===q.total) && (!q.exact||st[0]===q.a);
      if(ok){ locked=true; body.querySelectorAll(".sbtn").forEach(b=>b.disabled=true); paint(); correct(q, `${RAT(st[0],st[1])} = ${RAT(q.a,q.b)}. `); }
      else wrong(q.total&&st[0]+st[1]!==q.total? `المجموع يجب أن يكون ${q.total}.` : `قارن: هل ${st[0]} إلى ${st[1]} تساوي ${q.a} إلى ${q.b}؟`); }
    paint();
  },
  /* protractor: read an angle, or drag the arm to draw one */
  protr(q,body){
    const V=[200,212], Rr=172, side=q.side||"R", draw=q.mode==="draw"; let th=draw?(q.start||15):q.deg, locked=false, dragging=false;
    const P=(phi,r)=>[V[0]+r*Math.cos(phi*Math.PI/180), V[1]-r*Math.sin(phi*Math.PI/180)];
    const phiOf=t=> side==="R"? t : 180-t;
    function svg(){
      let s=`<path d="M${V[0]-Rr},${V[1]} A${Rr},${Rr} 0 0 1 ${V[0]+Rr},${V[1]} Z" fill="color-mix(in srgb,var(--yellow) 22%,transparent)" stroke="var(--ink)" stroke-width="1.5"/>`;
      for(let d=0;d<=180;d++){ const l=d%10===0?16:d%5===0?10:5, [x1,y1]=P(d,Rr), [x2,y2]=P(d,Rr-l); s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="${d%10?0.8:1.4}"/>`;
        if(d%10===0){ const [ox,oy]=P(d,Rr-28), [ix,iy]=P(d,Rr-50); s+=`<text x="${ox}" y="${oy}" class="po" text-anchor="middle" dominant-baseline="central">${d}</text><text x="${ix}" y="${iy}" class="pi" text-anchor="middle" dominant-baseline="central">${180-d}</text>`; } }
      s+=`<line x1="${V[0]-Rr}" y1="${V[1]}" x2="${V[0]+Rr}" y2="${V[1]}" stroke="var(--ink)" stroke-width="1.5"/>`;
      const a1=P(side==="R"?0:180,Rr+18), a2=P(phiOf(th),Rr+18);
      s+=`<line x1="${V[0]}" y1="${V[1]}" x2="${a1[0]}" y2="${a1[1]}" stroke="var(--pink)" stroke-width="4" stroke-linecap="round"/>`;
      s+=`<line x1="${V[0]}" y1="${V[1]}" x2="${a2[0]}" y2="${a2[1]}" stroke="${locked?"var(--ok)":"var(--pink)"}" stroke-width="4" stroke-linecap="round"/>`;
      if(draw&&!locked) s+=`<circle id="hd" cx="${a2[0]}" cy="${a2[1]}" r="14" fill="var(--blue)" opacity=".85"/>`;
      s+=`<circle cx="${V[0]}" cy="${V[1]}" r="5" fill="var(--ink)"/>`;
      const L=q.L||["أ","ب","ج"]; const t1=P(side==="R"?0:180,Rr+38), t2=P(phiOf(th),Rr+40);
      s+=`<text class="pl" x="${V[0]}" y="${V[1]+26}" text-anchor="middle">${L[1]}</text><text class="pl" x="${t1[0]}" y="${t1[1]+8}" text-anchor="middle">${L[2]}</text><text class="pl" x="${t2[0]}" y="${t2[1]+8}" text-anchor="middle">${L[0]}</text>`;
      return `<svg class="shape geo prot" id="psvg" viewBox="-24 -26 448 270" width="448" style="max-width:100%;height:auto;touch-action:none" role="img" aria-label="منقلة">${s}</svg>`;
    }
    const paint=()=>{ $("#prv").innerHTML=svg(); };
    if(draw){
      body.insertAdjacentHTML("beforeend",`<div class="vis" id="prv" style="direction:ltr"></div>
        <div class="nudge"><button class="sbtn" id="am" aria-label="أنقص درجة">−</button><span class="dirnote" style="font-weight:400">اسحب الدائرة الزرقاء، أو اضبط بالزرين درجةً درجة</span><button class="sbtn" id="ap" aria-label="زِد درجة">+</button></div>`);
      checkBtn(()=>{ if(Math.abs(th-q.deg)<=1){ th=q.deg; locked=true; $("#ap").disabled=$("#am").disabled=true; paint(); correct(q); }
        else wrong(`ابدأ العدّ من الصفر الذي على الضلع ${(q.L||["أ","ب","ج"])[1]} ${(q.L||["أ","ب","ج"])[2]}. انتبه: أي التدريجين يبدأ بالصفر عند هذا الضلع؟`); },true);
      const at=e=>{ const r=$("#psvg").getBoundingClientRect(), x=(e.clientX-r.left)*448/r.width-24, y=(e.clientY-r.top)*270/r.height-26;
        let phi=Math.round(Math.atan2(V[1]-y,x-V[0])*180/Math.PI); if(phi<0) phi= phi<-90?180:0; return side==="R"? phi : 180-phi; };
      $("#prv").addEventListener("pointerdown",e=>{ if(locked) return; dragging=true; th=Math.max(1,Math.min(179,at(e))); paint(); e.preventDefault(); });
      window.addEventListener("pointermove",e=>{ if(!dragging||locked) return; th=Math.max(1,Math.min(179,at(e))); paint(); });
      window.addEventListener("pointerup",()=>{ dragging=false; });
      $("#ap").addEventListener("click",()=>{ if(!locked){ th=Math.min(179,th+1); paint(); } }); $("#am").addEventListener("click",()=>{ if(!locked){ th=Math.max(1,th-1); paint(); } });
    } else {
      const d=q.deg, op=shuffle(uniqSort([d,180-d,d+10,Math.abs(d-10)].filter(x=>x>0&&x<180))).slice(0,4).sort((a,b)=>a-b);
      body.insertAdjacentHTML("beforeend",`<div class="vis" id="prv" style="direction:ltr"></div>
        <div class="eqline"><span class="eq" style="font-size:24px">قياس الزاوية = <select class="dd" id="dd0" aria-label="الدرجات"><option value="">?</option>${op.map(o=>`<option value="${o}">${o}</option>`).join("")}</select> درجة</span></div>`);
      const s0=$("#dd0");
      const btn=checkBtn(()=>{ if(+s0.value===d){ s0.disabled=true; s0.classList.add("right"); correct(q); } else { s0.classList.add("wrong"); wrong("مركز المنقلة على رأس الزاوية. اقرأ التدريج الذي يبدأ بالصفر على الضلع الأول للزاوية."); } },false);
      s0.addEventListener("change",()=>{ s0.classList.remove("wrong"); btn.disabled=s0.value===""; });
    }
    paint();
  },
  /* a dotted board, 1 cm between dots: place the missing corners */
  geo(q,body){
    const g=40, pad=34, C=q.c, Rw=q.r, P={...q.fixed}; let k=0, locked=false;
    const XY=([c,r])=>[pad+c*g, pad+r*g], Wd=pad*2+(C-1)*g, H=pad*2+(Rw-1)*g;
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="bv"></div><div class="counter" id="cc"></div>
      <div class="actions"><button class="btn ghost" id="undo" type="button">تراجع</button></div>`);
    const btn=checkBtn(check,false);
    function paint(){
      let s="";
      for(let r=0;r<Rw;r++) for(let c=0;c<C;c++){ const [x,y]=XY([c,r]); s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--muted)"/>`; }
      (q.segs||[]).forEach(sg=>{ const pr=SEGP(sg,{...q.fixed,...Object.fromEntries(q.place.map(n=>[n,1]))}); if(!pr) return; const [a,b]=pr; if(!P[a]||!P[b]) return;
        const [x1,y1]=XY(P[a]),[x2,y2]=XY(P[b]); s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${locked?"var(--ok)":"var(--pink)"}" stroke-width="4" stroke-linecap="round"/>`; });
      Object.keys(P).forEach(n=>{ const [x,y]=XY(P[n]); const fixed=n in q.fixed; s+=`<circle cx="${x}" cy="${y}" r="9" fill="${fixed?"var(--ink)":"var(--blue)"}"/><text class="pl" x="${x+15}" y="${y-15}" text-anchor="middle" dominant-baseline="central">${n}</text>`; });
      if(!locked) for(let r=0;r<Rw;r++) for(let c=0;c<C;c++){ const [x,y]=XY([c,r]); s+=`<rect class="dot" data-c="${c}" data-r="${r}" x="${x-g/2}" y="${y-g/2}" width="${g}" height="${g}" fill="transparent"/>`; }
      $("#bv").innerHTML=`<svg class="shape geo board" viewBox="0 0 ${Wd} ${H}" width="${Wd}" style="max-width:100%;height:auto" role="img" aria-label="لوحة نقاط">${s}</svg>`;
      $("#cc").innerHTML= k<q.place.length? `اضغط على النقطة التي تضع فيها الحرف <b>${q.place[k]}</b> &nbsp;·&nbsp; المسافة بين كل نقطتين متجاورتين ١ سم` : "اضغط تحقّق.";
      btn.disabled=locked||k<q.place.length;
      $("#bv").querySelectorAll(".dot").forEach(d=>d.addEventListener("click",()=>{ if(locked||k>=q.place.length) return; const c=+d.dataset.c, r=+d.dataset.r;
        if(Object.values(P).some(p=>p[0]===c&&p[1]===r)) return; P[q.place[k++]]=[c,r]; paint(); }));
    }
    $("#undo").addEventListener("click",()=>{ if(locked||k===0) return; delete P[q.place[--k]]; $("#fb").innerHTML=""; paint(); });
    function check(){ const res=q.check(P); if(res===true){ locked=true; $("#undo").disabled=true; paint(); correct(q); } else wrong(res); }
    paint();
  },
  /* open the compass on the ruler, then it draws the circle */
  compass(q,body){
    const S3=3, x0=30, want=q.r*10; let mm=12, locked=false, drag=false;
    body.insertAdjacentHTML("beforeend",`<div class="vis" id="kv" style="direction:ltr"></div>
      <div class="nudge"><button class="sbtn" id="km" aria-label="ضيّق الفتحة">−</button><span class="dirnote" style="font-weight:400">اسحب سن القلم على المسطرة لتفتح الفرجار</span><button class="sbtn" id="kp" aria-label="وسّع الفتحة">+</button></div>`);
    const btn=checkBtn(check,true);
    function paint(){
      const xp=x0+mm*S3, hx=(x0+xp)/2;
      let s=`<g transform="translate(20,150)">${rulerSvg()}</g>`;
      s+=`<line x1="${hx}" y1="24" x2="${x0}" y2="146" stroke="#556" stroke-width="5" stroke-linecap="round"/><line x1="${hx}" y1="24" x2="${xp}" y2="140" stroke="#556" stroke-width="5" stroke-linecap="round"/>
        <rect x="${xp-5}" y="112" width="10" height="26" fill="#F6B92B" stroke="#7A4A22"/><polygon points="${xp-5},138 ${xp+5},138 ${xp},148" fill="#333"/>
        <circle cx="${hx}" cy="22" r="8" fill="#889" /><rect x="${hx-4}" y="2" width="8" height="14" rx="3" fill="#889"/>
        <polygon points="${x0-3},140 ${x0+3},140 ${x0},150" fill="#333"/>`;
      if(!locked) s+=`<circle id="kh" cx="${xp}" cy="125" r="18" fill="var(--blue)" opacity=".25"/>`;
      $("#kv").innerHTML=`<svg class="shape rulerbox" id="ksvg" viewBox="0 0 380 210" width="380" style="max-width:100%;height:auto;touch-action:none" role="img" aria-label="فرجار ومسطرة">${s}</svg>`+
        (locked? `<svg class="shape geo" viewBox="0 0 240 240" width="220" role="img" aria-label="دائرة"><circle class="drawc" cx="120" cy="120" r="${q.r*22}" fill="none" stroke="var(--blue)" stroke-width="3.5"/><line x1="120" y1="120" x2="${120+q.r*22}" y2="120" stroke="var(--pink)" stroke-width="3"/><circle cx="120" cy="120" r="5" fill="var(--ink)"/><text class="pl" x="112" y="104" text-anchor="middle">م</text></svg>`:"");
    }
    const at=e=>{ const r=$("#ksvg").getBoundingClientRect(), x=(e.clientX-r.left)*380/r.width; return Math.max(5,Math.min(95,Math.round((x-x0)/S3))); };
    $("#kv").addEventListener("pointerdown",e=>{ if(locked) return; drag=true; mm=at(e); paint(); e.preventDefault(); });
    window.addEventListener("pointermove",e=>{ if(drag&&!locked){ mm=at(e); paint(); } });
    window.addEventListener("pointerup",()=>{ drag=false; });
    $("#kp").addEventListener("click",()=>{ if(!locked){ mm=Math.min(95,mm+1); paint(); } }); $("#km").addEventListener("click",()=>{ if(!locked){ mm=Math.max(5,mm-1); paint(); } });
    function check(){ if(mm===want){ locked=true; $("#kp").disabled=$("#km").disabled=true; btn.disabled=true; paint(); correct(q, `رُسمت دائرة نصف قطرها ${q.r} سم. `); }
      else wrong(`افتح الفرجار حتى يكون البعد بين السن والقلم ${q.r} سم على المسطرة.`); }
    paint();
  },
};

Object.assign(R,R4);

/* ---------- result ---------- */
function showResult(){
  const n=S.list.length, p=S.score/n, st=starsFor(p), id=S.lesson.id;
  if(st>B(id)){best[UNIT.key+"-"+id]=st;store.set("g4-best",best);}
  beep(st>=2);
  const msg = st===3?"ممتاز! أنت بطل الرياضيات":st===2?"أحسنت! أداء جيد جداً":st===1?"جيد، تدرّب مرة أخرى لتربح نجوماً أكثر":"لنراجع الدرس ونحاول من جديد";
  $("#view").innerHTML=`
    <section class="card result">
      <span class="tab">${id===FINAL.id?"كل الدروس":"الدرس "+ORD[id-1]} · ${S.lesson.name}</span>
      <div class="stars">${starStr(st)}</div>
      <div class="big">${S.score} / ${n}</div>
      <h2>${msg}</h2>
      <p class="sub">تُحسب النقطة للسؤال الذي تُجاب عنه صحيحاً من المحاولة الأولى.</p>
      <div class="actions">
        <button class="btn" id="again">العب مرة أخرى</button>
        <button class="btn ghost" id="toMap">الدروس</button>
      </div>
    </section>`;
  $("#again").addEventListener("click",()=>start(id));
  $("#toMap").addEventListener("click",showMap);
  updateTotal();
}

/* ---------- Arabic-Indic digits everywhere on screen ---------- */
const AD="٠١٢٣٤٥٦٧٨٩";
function arab(node){
  const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
  let t; while((t=w.nextNode())){ if(/[0-9]/.test(t.nodeValue)) t.nodeValue=t.nodeValue.replace(/[0-9]/g,d=>AD[d]); }
}
new MutationObserver(ms=>ms.forEach(m=>{
  if(m.type==="characterData"){ if(/[0-9]/.test(m.target.nodeValue)) arab(m.target.parentNode); }
  else m.addedNodes.forEach(n=>{ if(n.nodeType===3){ if(/[0-9]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/[0-9]/g,d=>AD[d]); } else if(n.nodeType===1) arab(n); });
})).observe($("#app"),{childList:true,subtree:true,characterData:true});

showHome();
arab($("#app"));
})();
