<style>
:root{--u:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:linear-gradient(165deg,#fff9b0 0%,#ffe766 55%,#ffd43b 100%);min-height:100vh;color:#2d2d2d;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{display:none;max-width:760px;margin:0 auto;padding:14px 14px 40px}
.screen.on{display:block}
/* digits */
.n{direction:ltr;unicode-bidi:embed;unicode-bidi:isolate;display:inline-flex;flex-direction:row;align-items:baseline;white-space:nowrap}
.d2{position:relative;display:inline-block}
.d2 svg{height:.74em;width:.46em;vertical-align:baseline;fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sg{direction:ltr;unicode-bidi:embed;unicode-bidi:isolate;display:inline-block;font-weight:900}
u{text-decoration:none;border-bottom:4px solid var(--u);padding-bottom:1px}
.bign u{border-bottom:5px solid #fff}
/* home */
.hero{text-align:center;padding:18px 10px 8px}
.hero-ic{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.hero h1{margin:4px 0 0;font-size:34px;font-weight:900;color:#c92a2a;text-shadow:0 3px 0 #fff}
.hero p{margin:2px 0 0;font-size:18px;font-weight:700;color:#5c3d00}
.units{display:grid;gap:14px;margin-top:18px}
@media(min-width:640px){.units{grid-template-columns:1fr 1fr}}
.ucard{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--c);border-radius:24px;padding:14px;box-shadow:0 7px 0 var(--c);text-align:right;transition:transform .15s}
.ucard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.ucard .ic{flex:none;width:72px;height:72px;border-radius:20px;background:var(--c);display:grid;place-items:center;font-size:40px}
.ucard .tx{flex:1;display:flex;flex-direction:column}
.ucard small{font-size:15px;font-weight:800;color:var(--c)}
.ucard b{font-size:19px;font-weight:900;line-height:1.5}
.ucard .go{font-size:22px;color:var(--c)}
.credit{margin:28px auto 0;text-align:center;background:#fff;border-radius:18px;padding:12px;font-weight:800;font-size:17px;max-width:360px;box-shadow:0 5px 0 #f59f00}
.credit a{color:#1971c2;text-decoration:none;display:inline-block;margin-top:4px}
/* game */
.top{display:flex;align-items:center;gap:8px}
.ib{border:none;background:#fff;border-radius:16px;width:48px;height:48px;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.gt{flex:1;font-weight:900;font-size:17px;line-height:1.35;color:#3b2a00}
.stars{background:#fff;border-radius:16px;padding:6px 12px;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.pw{display:flex;align-items:center;gap:10px;margin-top:12px}
.prog{flex:1;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.prog i{display:block;height:100%;width:0;background:var(--u);border-radius:10px;transition:width .5s}
.qn{font-weight:800;font-size:15px;white-space:nowrap}
.card{background:#fff;border:4px solid var(--u);border-radius:28px;padding:18px 10px 24px;margin-top:14px;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.08);min-height:340px}
.card.pop{animation:pop .4s ease}
.prompt{font-size:22px;font-weight:900;line-height:1.7;margin:2px 4px 14px;color:#212529}
.vis{margin:4px 0 18px}
.hint{font-size:18px;font-weight:800;color:var(--u);margin:-6px 0 12px;min-height:27px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{min-width:86px;min-height:74px;font-size:36px;font-weight:900;border:none;border-radius:22px;background:#eef1ff;box-shadow:0 6px 0 #c5cbf2;padding:6px 14px;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 #c5cbf2}
.opt.ok{background:#b2f2bb!important;box-shadow:0 6px 0 #51cf66!important}
.opt.bad{background:#ffc9c9!important;box-shadow:0 6px 0 #ff8787!important}
.opt.sel{background:#fff3bf;box-shadow:0 6px 0 #fab005;transform:translateY(-3px)}
.opts.pad{max-width:420px;margin:0 auto}
.opts.pad .opt{min-width:62px;min-height:62px;font-size:32px;border-radius:18px}
.opts.grid .opt{background:#fffbe6;box-shadow:0 6px 0 #ffe066;min-width:130px;padding:10px;font-size:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.opts.txt .opt{font-size:22px;min-width:130px}
.opts.big .opt{font-size:24px;min-width:140px}
.cap{font-size:20px;font-weight:900}
.lbl{font-size:18px;font-weight:800}
.emo{line-height:1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* equations */
.eq{display:flex;gap:10px;justify-content:center;align-items:center;font-size:40px;font-weight:900;flex-wrap:wrap}
.eq .op{color:var(--u)}
.eq.sm{font-size:24px;gap:5px}
.eq.md{font-size:30px;gap:7px}
.box{display:inline-grid;place-items:center;min-width:64px;height:62px;border:3px dashed var(--u);border-radius:16px;color:var(--u);font-size:34px;font-weight:900;padding:0 8px;background:#fff}
.box.filled{border-style:solid;border-color:#40c057;background:#ebfbee;color:#2b8a3e;animation:pop .35s}
.bign{display:inline-grid;place-items:center;min-width:96px;height:96px;padding:0 16px;border-radius:48px;background:var(--u);color:#fff;font-size:46px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.bn{font-size:34px;font-weight:900;color:#d6336c}
.tag{display:inline-block;background:#fff3bf;border-radius:14px;padding:4px 14px;font-size:22px;font-weight:900;margin:2px}
/* vertical working */
.vg{display:inline-grid;direction:ltr;gap:2px 4px;background:#f8f9ff;border-radius:20px;padding:6px 16px 12px;font-weight:900;font-size:38px;align-items:center;justify-items:center}
.vg>div{min-height:46px;display:grid;place-items:center}
.vg .mk{font-size:17px;color:#e8590c;min-height:22px;height:22px}
.vg .st{position:relative;color:#868e96}
.vg .st::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:4px;background:#e03131;border-radius:2px;transform:rotate(-22deg)}
.vg .ln{grid-column:1/-1;height:5px!important;min-height:5px!important;background:#333;width:100%;border-radius:3px}
.vg .op{color:var(--u)}
.vg .ab{width:46px;height:52px;border:3px dashed #ced4da;border-radius:12px;font-size:32px;background:#fff}
.vg .ab.act{border:3px solid var(--u);background:#fff9db;animation:pulse 1.2s infinite}
.vg .ab.f{border:3px solid #40c057;background:#ebfbee;color:#2b8a3e}
.vg .ab.bad{background:#ffc9c9}
.vg .bx{width:46px;height:50px;border:3px dashed var(--u);border-radius:12px;color:var(--u);font-size:30px;background:#fff}
.vg .bx.filled{border-style:solid;border-color:#40c057;background:#ebfbee;color:#2b8a3e}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,176,5,.6)}50%{box-shadow:0 0 0 6px rgba(250,176,5,0)}}
/* base ten blocks */
.blk{display:inline-flex;direction:ltr;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;background:#fffdf5;border-radius:18px;padding:12px}
.bgp{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:flex-end;max-width:170px}
.flat{width:46px;height:46px;background-color:#ffe3ec;background-image:linear-gradient(#d6336c 1px,transparent 1px),linear-gradient(90deg,#d6336c 1px,transparent 1px);background-size:4.6px 4.6px;border:1.5px solid #a61e4d;transform:skewX(-8deg)}
.rodb{width:8px;height:46px;background-color:#d0ebff;background-image:linear-gradient(#1c7ed6 1px,transparent 1px);background-size:8px 4.6px;border:1.5px solid #1864ab}
.cube{width:9px;height:9px;background:#d3f9d8;border:1.5px solid #2b8a3e}
.bgp.u{max-width:50px}
/* abacus */
.ab3{display:inline-flex;direction:ltr;gap:4px;align-items:flex-end;padding:0 10px;border-bottom:6px solid #343a40;border-radius:3px}
.rc{display:flex;flex-direction:column;align-items:center;width:66px}
.rl{font-size:15px;font-weight:800;margin-bottom:4px}
.rod3{position:relative;width:66px;height:126px;display:flex;flex-direction:column-reverse;align-items:center;gap:1px}
.rod3::before{content:'';position:absolute;left:31px;width:4px;top:0;bottom:0;background:#343a40;border-radius:2px}
.rg{position:relative;width:40px;height:12px;border:3.5px solid;border-radius:50%;flex:none}
.abb{display:flex;direction:ltr;gap:4px;justify-content:center;margin:10px auto 14px;padding:0 10px}
.abb .bc{width:66px;display:flex;flex-direction:column;gap:6px;align-items:center}
.abb button{width:54px;height:42px;border:none;border-radius:12px;font-size:24px;font-weight:900;color:#fff}
/* groups / dots */
.dgs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin:0 auto}
.dg{display:inline-flex;flex-wrap:wrap;gap:3px;border:2.5px solid #adb5bd;border-radius:12px;padding:5px;justify-content:center;align-content:center}
.dt{width:15px;height:15px;border-radius:50%;background:var(--dc,#e03131)}
.eg{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;border:2.5px solid #ffd43b;background:#fffdf0;border-radius:14px;padding:6px;font-size:24px;line-height:1.15}
.eg span{width:28px}
/* number line */
.nlw{position:relative;width:320px;height:96px;margin:0 auto 6px;direction:ltr}
.nlw>svg{position:absolute;left:0;top:0}
.nlw .lb{position:absolute;top:62px;white-space:nowrap;width:max-content;transform:translateX(-50%);font-size:17px;font-weight:900}
/* hundred chart skip */
.hc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:380px;margin:0 auto;direction:rtl}
.hc button{height:48px;border:none;border-radius:12px;background:#f1f3f5;font-size:22px;font-weight:900;box-shadow:0 3px 0 #dee2e6}
.hc button.on{background:var(--u);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:pop .3s}
.hc button.bad{background:#ffc9c9}
/* share */
.pool{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:44px;max-width:360px;margin:0 auto 12px;font-size:30px}
.bxs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.sbx{border:none;background:#fff4e6;border:3px solid #ffa94d;border-top:none;border-radius:0 0 16px 16px;width:78px;min-height:84px;padding:4px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:1px;font-size:20px}
.sbx.bad{background:#ffc9c9}
.mini{border:none;background:#fff;border:2px solid #ced4da;border-radius:12px;font-size:16px;font-weight:800;padding:4px 14px;margin-bottom:12px}
/* sort */
.sitem{display:inline-grid;place-items:center;min-width:180px;min-height:130px;background:#f8f9fa;border:3px solid #dee2e6;border-radius:22px;padding:10px;margin-bottom:16px}
.sitem svg{width:150px;height:110px}
.sitem svg *{fill:none;stroke:#212529;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.opts.cats .opt{font-size:20px;min-width:100px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.opts.cats .opt small{font-size:14px;color:#495057}
.shp svg{width:92px;height:78px}
.shp svg *{fill:#e7f5ff;stroke:#1c7ed6;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.shp.ln svg *{fill:none;stroke:#212529}
/* match */
.mcols{display:flex;justify-content:center;gap:14px}
.mcol{display:flex;flex-direction:column;gap:12px;flex:1;max-width:220px}
.mi{border:3px solid #dee2e6;background:#fff;border-radius:18px;min-height:70px;padding:6px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;position:relative;font-weight:900;font-size:22px}
.mi.sel{border-color:#fab005;background:#fff9db;transform:scale(1.04)}
.mi.done{border-color:#40c057}
.mi.done::after{content:'✓';position:absolute;top:-10px;left:-8px;background:#40c057;color:#fff;border-radius:50%;width:26px;height:26px;font-size:16px;display:grid;place-items:center}
.mi.bad{border-color:#fa5252;background:#fff5f5}
/* order */
.slots{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.slot{min-width:72px;min-height:66px;border:3px dashed #adb5bd;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;padding:4px 8px;background:#f8f9fa}
.slot.full{border-style:solid;border-color:#51cf66;background:#ebfbee;animation:pop .3s}
.slots.col{flex-direction:column;align-items:stretch;max-width:330px;margin:0 auto 18px}
.slots.col .slot{justify-content:flex-start;gap:12px;font-size:20px;min-height:58px}
.slots.col .sl{width:34px;height:34px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.slots.col .sv{display:flex;align-items:center;gap:8px}
.pool2.txt .opt{font-size:20px;min-height:58px;min-width:120px}
.pool2 .opt{font-size:30px}
/* misc */
.chart{display:flex;direction:rtl;justify-content:center;gap:6px;flex-wrap:wrap}
.chart .c,.chart .box{min-width:58px;height:52px;border-radius:12px;font-size:24px;font-weight:900}
.chart .c{background:#f3f0ff;display:grid;place-items:center;padding:0 6px}
.tbl{border-collapse:collapse;margin:0 auto;direction:rtl}
.tbl td{border:2px solid #b197fc;min-width:44px;height:48px;font-size:22px;font-weight:900;text-align:center;padding:2px 4px}
.tbl td.h{background:#f3f0ff;color:#5f3dc4}
.tbl .box{min-width:44px;height:42px;font-size:22px;border-width:2px;border-radius:10px;padding:0 4px}
.wp{font-size:20px;font-weight:800;line-height:1.9;background:#f8f9ff;border-radius:18px;padding:12px}
.wp .emo{font-size:46px;display:block}
.cards{display:flex;gap:10px;justify-content:center;direction:rtl}
.cards span{width:58px;height:70px;border-radius:12px;background:#fff;border:3px solid var(--u);display:grid;place-items:center;font-size:36px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.act{display:inline-flex;flex-direction:column;align-items:center;background:#fff9db;border-radius:22px;padding:12px 20px;gap:6px}
.act .emo{font-size:64px}
.act b{font-size:20px}
.tree{font-size:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:260px;margin:0 auto;background:#ebfbee;border-radius:16px;padding:8px}
/* feedback */
.fb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:#fff;border-radius:26px;padding:16px 28px;font-size:30px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:all .25s;z-index:20;white-space:nowrap}
.fb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fb.g{color:#2b8a3e;border:4px solid #51cf66}
.fb.b{color:#e8590c;border:4px solid #ffa94d}
.endc{background:#fff;border-radius:30px;padding:30px 16px;text-align:center;margin-top:30px;border:4px solid var(--u);box-shadow:0 9px 0 rgba(0,0,0,.08)}
.endc .tr{font-size:90px;animation:bob 2s infinite}
.endc h2{font-size:22px;margin:6px 0;line-height:1.6}
.endc .es{font-size:34px;font-weight:900;margin:8px 0}
.endc p{font-size:21px;font-weight:800;margin:6px 0 20px}
.endc .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:20px;background:var(--u);color:#fff;font-size:24px;font-weight:900;padding:10px 34px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn.alt{background:#fff;color:#333;border:3px solid var(--u)}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:30;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ===== visual theme ===== */
body{color:#2b2140;background:
 radial-gradient(circle at 8% 12%,#ffe0ec 0 90px,transparent 92px),
 radial-gradient(circle at 94% 26%,#dbeeff 0 120px,transparent 122px),
 radial-gradient(circle at 12% 82%,#dcf7e3 0 110px,transparent 112px),
 radial-gradient(circle at 90% 92%,#fff1c2 0 100px,transparent 102px),
 radial-gradient(#f1d9b0 1.3px,transparent 1.6px) 0 0/22px 22px,
 #fff8ec;background-attachment:fixed}

 background:linear-gradient(135deg,#ff9a5a 0%,#ff5f8f 50%,#9b6bff 100%);box-shadow:0 10px 0 #d9487a,0 22px 40px rgba(155,60,120,.28)}

.units{margin-top:24px;gap:16px}
.ucard{border:none;border-radius:26px;padding:12px 14px;background:#fff;box-shadow:0 7px 0 var(--c),0 14px 26px rgba(60,40,90,.10);position:relative;overflow:hidden}
.ucard::before{content:'';position:absolute;inset:0 0 auto auto;width:8px;height:100%;background:var(--c)}
.ucard:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c),0 6px 12px rgba(60,40,90,.10)}
.ucard .ic{width:70px;height:70px;border-radius:22px;background-color:var(--c);background-image:linear-gradient(150deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);margin-right:6px}
.ucard small{font-size:15px}
.ucard b{color:#2b2140}
.ucard .go{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.credit{background:#fff;border:3px dashed #ffb48a;box-shadow:none;border-radius:22px;color:#5c3d2e}
/* game screen */
.top{background:#fff;border-radius:24px;padding:8px;box-shadow:0 6px 0 rgba(60,40,90,.08),0 10px 24px rgba(60,40,90,.08)}
.ib{background:#f4f1ff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);border-radius:16px}
.gt{color:var(--u);font-size:18px}

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const AD='٠١٢٣٤٥٦٧٨٩';
const TWO='<span class="d2"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M50 22C41 15 24 16 18 27C14 35 20 47 27 58L44 92"/></svg><span class="sr">٢</span></span>';
const D1=d=>d==='2'?TWO:AD[d];
const ar=x=>'<span class="n">'+String(x).replace(/\d/g,D1)+'</span>';
const arU=(x,i)=>'<span class="n">'+String(x).split('').map((d,j)=>j===i?'<u>'+D1(d)+'</u>':D1(d)).join('')+'</span>';

const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const swapn=n=>{const s=String(n),r=+s.split('').reverse().join('');return String(r).length===s.length?r:n+11};

 for(const v of c){if(s.length>=k)break;if(v>=min&&v<=max&&!s.includes(v))s.push(v)}let g=0;while(s.length<k&&g<500){g++;const v=rnd(min,max);if(!s.includes(v))s.push(v)}return shuf(s).map(v=>({h:ar(v),k:v}))}
const mulO=(ans,n)=>opt3(ans,0,100,4,[ans+n,ans-n,ans+1,ans-1,ans+2]);

 return `<div class="nlw"><svg width="320" height="70" viewBox="0 0 320 70"><line x1="4" y1="54" x2="316" y2="54" stroke="#495057" stroke-width="3"/>${p}</svg>${lb}</div>`}

 rows.forEach((r,i)=>{r.forEach(x=>s+=`<div>${x}</div>`);s+=`<div class="op">${i===opRow?op:''}</div>`;if(i===lineAfter)s+='<div class="ln"></div>'});return s+'</div>'}

 5:[()=>poly(5,46,42,36)],6:[()=>poly(6,46,40,36,0)],7:[()=>poly(7,46,41,36)]};

const OPENC=['M20 80 Q50 5 90 40 T135 30','M40 20 C100 10 20 70 80 90','M95 20 A35 35 0 1 0 100 85','M30 90 C10 40 60 10 70 50 S120 80 130 20','M20 60 Q75 0 130 60','M110 15 C40 10 40 95 115 95','M30 25 C130 0 10 100 120 90'];
const CLOSEDC=['M75 15 C130 15 135 90 75 95 C20 98 15 15 75 15Z','M30 40 C30 10 90 5 105 30 C135 60 95 95 60 85 C25 80 30 60 30 40Z','M20 55 C20 20 60 25 75 40 C90 20 135 25 125 60 C115 95 30 100 20 55Z','M40 20 L110 25 C135 55 120 90 80 90 C40 95 15 70 25 45Z'];

/* ===== sound ===== */
let AC,MUTE=false;
function sfx(t){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const S={ok:[[660,0],[880,.1],[1175,.2]],no:[[230,0],[175,.16]],tap:[[540,0]],pair:[[700,0],[930,.08]],win:[[523,0],[659,.15],[784,.3],[1047,.45],[1319,.6]]}[t];
 S.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+d;o.type=t==='no'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(t==='no'?.07:.2,T+.02);g.gain.exponentialRampToValueAtTime(.0001,T+.24);o.connect(g).connect(AC.destination);o.start(T);o.stop(T+.26)})}catch(e){}}
$('#mute').onclick=()=>{MUTE=!MUTE;$('#mute').textContent=MUTE?'🔕':'🔔'};
let arVoice=null;
if('speechSynthesis' in window){const lv=()=>{arVoice=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang))||null;$('#say').style.display=arVoice?'':'none'};lv();speechSynthesis.onvoiceschanged=lv;
 $('#say').onclick=()=>{const p=$('#card .prompt');if(!p||!arVoice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(p.textContent);u.voice=arVoice;u.lang=arVoice.lang;u.rate=.85;speechSynthesis.speak(u)}}

/* ===== engine ===== */
let st={};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');scrollTo(0,0)}
function start(i){const U=UNITS[i];document.documentElement.style.setProperty('--u',U.c);st={u:i,qs:U.g(),i:0,stars:0,lock:false};$('#gtitle').innerHTML=U.k;go('game');render()}
function render(){const q=st.qs[st.i];q.ft=true;st.lock=false;
 $('#bar').style.width=(st.i/st.qs.length*100)+'%';$('#qn').innerHTML=`${ar(st.i+1)} من ${ar(st.qs.length)}`;$('#st').innerHTML='⭐ '+ar(st.stars);
 const c=$('#card');c.innerHTML=`<div class="prompt">${q.p}</div>`;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');R[q.t](q,c);scrollTo(0,0)}
function ok(){if(st.lock)return;st.lock=true;const q=st.qs[st.i];if(q.ft)st.stars++;$('#st').innerHTML='⭐ '+ar(st.stars);sfx('ok');fb(true);
 setTimeout(()=>{st.i++;st.i>=st.qs.length?finish():render()},1400)}

const GOOD=['أحسنت! 🌟','ممتاز! 🎉','رائع! 👏','بطل! 🏆','عمل جميل! 💯'],BAD=['حاول مرة أخرى 💪','فكّر جيداً وحاول 🤔','لا بأس، حاول مرة أخرى 🙂'];

 $('#endT').innerHTML='أنهيت '+UNITS[st.u].k+'<br>'+UNITS[st.u].t;$('#endS').innerHTML=`⭐ ${ar(s)} من ${ar(n)}`;
 $('#endM').textContent=s===n?'ممتاز! أنت بطل الرياضيات 🏆':s>=n*.7?'أحسنت! عمل رائع 🎉':'جيد! تدرّب مرة أخرى لتصبح أفضل 💪';go('end');confetti()}
function confetti(){const C=['#ff6b6b','#4dabf7','#51cf66','#fcc419','#9775fa','#ff922b'];for(let i=0;i<60;i++){const d=el('div','cf');d.style.left=Math.random()*100+'vw';d.style.background=pick(C);d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}
function optsEl(q,c,list,ans,lay,cb){const w=el('div','opts '+(lay||''));list.forEach(o=>{const b=el('button','opt');b.innerHTML=o.h;
 b.onclick=()=>{if(st.lock)return;if(o.k===ans){b.classList.add('ok');if(!q.nofill)fill(c,q.fh||o.h);cb?cb():ok()}else no(b)};w.appendChild(b)});return w}

/* ===== renderers ===== */
const R={
 choice(q,c){c.insertAdjacentHTML('beforeend',`<div class="vis">${q.v||''}</div>`);c.appendChild(optsEl(q,c,q.o,q.a,q.lay))},
 match(q,c){const n=q.pairs.length,wrap=el('div','mcols'),A=el('div','mcol'),Bc=el('div','mcol'),PAL=['#ffe3e3','#d3f9d8','#d0ebff','#fff3bf'];let sel=null,done=0;

  shuf(range(0,n-1)).forEach(i=>A.appendChild(mk(q.pairs[i][0],i,'a')));shuf(range(0,n-1)).forEach(i=>Bc.appendChild(mk(q.pairs[i][1],i,'b')));wrap.append(A,Bc);c.appendChild(wrap)},
 order(q,c){const exp=[...q.items].sort((x,y)=>x.v-y.v),sl=el('div','slots'+(q.col?' col':''));

  c.appendChild(sl);let k=0;const pool=el('div','opts pool2'+(q.col?' txt':''));
  shuf(q.items).forEach(it=>{const b=el('button','opt');b.innerHTML=it.h;b.onclick=()=>{if(st.lock)return;

 /* vertical add/subtract, digit by digit from the ones column */
 colop(q,c){const isAdd=q.op==='+',r=isAdd?q.a+q.b:q.a-q.b,A=String(q.a),Bs=String(q.b),Rs=String(r),C=Math.max(A.length,Bs.length,Rs.length);
  const pad=s=>{const a=s.split('');while(a.length<C)a.unshift('');return a};const ad=pad(A),bd=pad(Bs),rd=pad(Rs);
  const g=el('div','vg');g.style.gridTemplateColumns=`repeat(${C},48px) 40px`;const mk=[],top=[],ans=[];
  for(let i=0;i<C;i++){const m=el('div','mk');mk.push(m);g.appendChild(m)}g.appendChild(el('div','mk'));
  for(let i=0;i<C;i++){const d=el('div');d.innerHTML=ad[i]?ar(ad[i]):'';top.push(d);g.appendChild(d)}g.appendChild(el('div'));
  for(let i=0;i<C;i++){const d=el('div');d.innerHTML=bd[i]?ar(bd[i]):'';g.appendChild(d)}const o=el('div','op');o.textContent=isAdd?'+':'−';g.appendChild(o);
  g.appendChild(el('div','ln'));
  for(let i=0;i<C;i++){if(rd[i]===''){g.appendChild(el('div'));ans.push(null)}else{const d=el('div','ab');ans.push(d);g.appendChild(d)}}g.appendChild(el('div'));
  const vis=el('div','vis');vis.appendChild(g);c.appendChild(vis);
  const hint=el('div','hint');c.appendChild(hint);
