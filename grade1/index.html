<style>
:root{--u:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:linear-gradient(165deg,#fff9b0 0%,#ffe766 55%,#ffd43b 100%);min-height:100vh;color:#2d2d2d;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{display:none;max-width:760px;margin:0 auto;padding:14px 14px 40px}
.screen.on{display:block}
/* digits */
.n{direction:ltr;unicode-bidi:embed;unicode-bidi:isolate;display:inline-flex;flex-direction:row;align-items:baseline;white-space:nowrap}
.d2{position:relative;display:inline-block}
.d2 svg{height:.74em;width:.46em;vertical-align:baseline;fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sg{direction:ltr;unicode-bidi:embed;unicode-bidi:isolate;display:inline-block;font-weight:900}
/* home */
.hero{text-align:center;padding:18px 10px 8px}
.hero-ic{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.hero h1{margin:4px 0 0;font-size:34px;font-weight:900;color:#c92a2a;text-shadow:0 3px 0 #fff}
.hero p{margin:2px 0 0;font-size:18px;font-weight:700;color:#5c3d00}
.units{display:grid;gap:14px;margin-top:18px}
@media(min-width:640px){.units{grid-template-columns:1fr 1fr}}
.ucard{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--c);border-radius:24px;padding:14px;box-shadow:0 7px 0 var(--c);text-align:right;transition:transform .15s}
.ucard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.ucard .ic{flex:none;width:72px;height:72px;border-radius:20px;background:var(--c);display:grid;place-items:center;font-size:40px}
.ucard .tx{flex:1;display:flex;flex-direction:column}
.ucard small{font-size:15px;font-weight:800;color:var(--c)}
.ucard b{font-size:19px;font-weight:900;line-height:1.5}
.ucard .go{font-size:22px;color:var(--c)}
.credit{margin:28px auto 0;text-align:center;background:#fff;border-radius:18px;padding:12px;font-weight:800;font-size:17px;max-width:360px;box-shadow:0 5px 0 #f59f00}
.credit a{color:#1971c2;text-decoration:none;display:inline-block;margin-top:4px}
/* game */
.top{display:flex;align-items:center;gap:8px}
.ib{border:none;background:#fff;border-radius:16px;width:48px;height:48px;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.gt{flex:1;font-weight:900;font-size:17px;line-height:1.35;color:#3b2a00}
.stars{background:#fff;border-radius:16px;padding:6px 12px;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.pw{display:flex;align-items:center;gap:10px;margin-top:12px}
.prog{flex:1;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.prog i{display:block;height:100%;width:0;background:var(--u);border-radius:10px;transition:width .5s}
.qn{font-weight:800;font-size:15px;white-space:nowrap}
.card{background:#fff;border:4px solid var(--u);border-radius:28px;padding:18px 12px 24px;margin-top:14px;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.08);min-height:340px}
.card.pop{animation:pop .4s ease}
.prompt{font-size:22px;font-weight:900;line-height:1.7;margin:2px 4px 14px;color:#212529}
.vis{margin:4px 0 18px}
.hint{font-size:18px;font-weight:800;color:var(--u);margin:-6px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{min-width:86px;min-height:78px;font-size:40px;font-weight:900;border:none;border-radius:22px;background:#eef1ff;box-shadow:0 6px 0 #c5cbf2;padding:6px 14px;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 #c5cbf2}
.opt.ok{background:#b2f2bb!important;box-shadow:0 6px 0 #51cf66!important}
.opt.bad{background:#ffc9c9!important;box-shadow:0 6px 0 #ff8787!important}
.opt.sel{background:#fff3bf;box-shadow:0 6px 0 #fab005;transform:translateY(-3px)}
.opts.pad{max-width:420px;margin:0 auto}
.opts.pad .opt{min-width:64px;min-height:64px;font-size:34px;border-radius:18px}
.opts.grid .opt{background:#fffbe6;box-shadow:0 6px 0 #ffe066;min-width:130px;padding:10px;font-size:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.opts.big .opt{font-size:24px;min-width:140px}
.opts.txt .opt{font-size:22px;min-width:130px}
.cap{font-size:22px;font-weight:900}
.lbl{font-size:18px;font-weight:800}
.emo{line-height:1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* equations */
.eq{display:flex;gap:12px;justify-content:center;align-items:center;font-size:46px;font-weight:900;flex-wrap:wrap}
.eq .op{color:var(--u)}
.eq.sm{font-size:26px;gap:6px}
.box{display:inline-grid;place-items:center;min-width:66px;height:66px;border:3px dashed var(--u);border-radius:16px;color:var(--u);font-size:36px;font-weight:900;padding:0 8px;background:#fff}
.box.filled{border-style:solid;border-color:#40c057;background:#ebfbee;color:#2b8a3e;animation:pop .35s}
.vert{display:inline-flex;flex-direction:column;direction:ltr;font-size:46px;font-weight:900;background:#f8f9ff;border-radius:20px;padding:10px 22px}
.vr{display:flex;justify-content:space-between;align-items:center;gap:26px;min-width:150px;min-height:62px}
.vr .op{color:var(--u);min-width:26px}
.vl{height:5px;background:#333;border-radius:3px;margin:4px 0 8px}
.bign{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--u);color:#fff;font-size:56px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.bn{font-size:40px;font-weight:900;color:#d6336c}
/* groups */
.grp{display:inline-flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;max-width:250px;min-width:76px;min-height:76px;padding:10px;border:3px solid #ffd43b;border-radius:18px;background:#fffdf0;vertical-align:middle}
.grp span{font-size:34px;width:44px;line-height:1.25}
.grp.sm{max-width:136px;min-width:60px;min-height:60px;padding:6px;gap:2px}
.grp.sm span{font-size:22px;width:28px}
.pair{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pair .w{font-size:28px;font-weight:900;color:var(--u)}
/* colour shapes */
.shapes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px;margin:0 auto 18px}
.shp{border:none;background:none;padding:2px;width:62px;height:62px}
.shp svg{width:100%;height:100%}
.shp svg path{fill:#fff;stroke:#333;stroke-width:3.5;transition:fill .2s}
.shp.on svg path{fill:var(--f)}
.btn{border:none;border-radius:20px;background:var(--u);color:#fff;font-size:24px;font-weight:900;padding:10px 34px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn.alt{background:#fff;color:#333;border:3px solid var(--u)}
/* match */
.mcols{display:flex;justify-content:center;gap:16px}
.mcol{display:flex;flex-direction:column;gap:12px;flex:1;max-width:220px}
.mi{border:3px solid #dee2e6;background:#fff;border-radius:18px;min-height:74px;padding:6px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;position:relative;font-weight:900;font-size:22px}
.mi.sel{border-color:#fab005;background:#fff9db;transform:scale(1.04)}
.mi.done{border-color:#40c057}
.mi.done::after{content:'✓';position:absolute;top:-10px;left:-8px;background:#40c057;color:#fff;border-radius:50%;width:26px;height:26px;font-size:16px;display:grid;place-items:center}
.mi.bad{border-color:#fa5252;background:#fff5f5}
.mi .grp{border:none;background:none}
.cup{font-size:28px}
/* order */
.slots{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.slot{min-width:72px;min-height:72px;border:3px dashed #adb5bd;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;padding:4px 8px;background:#f8f9fa}
.slot.full{border-style:solid;border-color:#51cf66;background:#ebfbee;animation:pop .3s}
.slots.col{flex-direction:column;align-items:stretch;max-width:330px;margin:0 auto 18px}
.slots.col .slot{justify-content:flex-start;gap:12px;font-size:20px;min-height:64px}
.slots.col .sl{width:34px;height:34px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.slots.col .sv{display:flex;align-items:center;gap:8px}
.pool.grid .opt{flex-direction:row;justify-content:center;min-height:64px;font-size:20px;font-weight:800}
/* cross */
.xgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:330px;margin:0 auto 18px}
.xi{border:3px solid #ffe066;background:#fffdf0;border-radius:16px;width:62px;height:62px;font-size:34px;position:relative;padding:0}
.xi.x::after{content:'';position:absolute;left:4px;right:4px;top:50%;height:5px;background:#e03131;border-radius:3px;transform:rotate(-45deg)}
.xi.x{opacity:.65}
/* number line */
.nl{display:flex;direction:rtl;justify-content:center;position:relative;margin:6px auto 10px;max-width:520px}
.nl::before{content:'';position:absolute;left:4px;right:4px;top:52px;height:4px;background:#495057;border-radius:2px}
.tk{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;padding:0;min-width:0}
.tk .fr{height:40px;font-size:30px;line-height:40px}
.tk .tl{width:4px;height:18px;background:#495057;border-radius:2px;margin-top:4px}
.tk b{font-size:22px;font-weight:900;margin-top:4px;width:30px;height:34px;border-radius:10px;display:grid;place-items:center}
.tk.vis2 b{background:var(--u);color:#fff}
.tk.bad b{background:#ffc9c9}
/* abacus */
.abac{display:flex;direction:ltr;justify-content:center;gap:18px;align-items:flex-end}
.ab-g{display:flex;flex-direction:column;align-items:center;gap:6px}
.rods{display:flex;gap:4px;align-items:flex-end;height:112px;border-bottom:7px solid #b07a3c;border-radius:3px;padding:0 6px}
.rod{width:16px;height:104px;position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:1px}
.rod::before{content:'';position:absolute;left:6px;width:4px;top:0;bottom:0;background:#d39b5b;border-radius:2px}
.rod i{position:relative;width:16px;height:8px;border-radius:5px;display:block}
.ab-g .cap{font-size:16px}
/* misc visuals */
.beads{display:flex;direction:rtl;justify-content:center;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.beads i{width:24px;height:24px;border-radius:50%;display:block;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.beads .sp{width:14px;box-shadow:none}
.chart{display:flex;direction:rtl;justify-content:center;gap:6px;flex-wrap:wrap}
.chart .c,.chart .box{min-width:52px;height:52px;border-radius:12px;font-size:26px;font-weight:900}
.chart .c{background:#f3f0ff;display:grid;place-items:center}
.toys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.toy{background:#fff4e6;border-radius:16px;padding:8px 4px;font-weight:800;font-size:15px}
.toy .emo{font-size:36px}
.toy .pr{color:#d9480f;font-size:17px}
.pencil{height:22px;background:linear-gradient(var(--pc),var(--pc) 60%,rgba(0,0,0,.15));border-radius:5px 0 0 5px;position:relative;display:inline-block;margin-right:22px;vertical-align:middle}
.pencil::after{content:'';position:absolute;right:-22px;top:0;border-left:22px solid #f4c27a;border-top:11px solid transparent;border-bottom:11px solid transparent}
.boards{display:flex;flex-direction:column;gap:2px;align-items:center}
.boards i{width:76px;height:12px;background:linear-gradient(#e8b47a,#c58440);border-radius:3px;display:block}
.days{display:flex;direction:rtl;justify-content:center;gap:8px;flex-wrap:wrap}
.days .d{background:#fff4e6;border-radius:14px;padding:8px 12px;font-weight:900;font-size:19px;min-height:58px;display:grid;place-items:center;border:3px solid #ffd8a8}
.days .box{min-width:96px;height:58px;font-size:26px}
.ytt{display:flex;direction:rtl;justify-content:center;gap:10px;flex-wrap:wrap}
.ytt .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.ytt small{font-size:17px;font-weight:900;color:var(--u)}
.ytt .d{background:#fff4e6;border-radius:14px;padding:8px 12px;font-weight:900;font-size:19px;min-width:96px;min-height:58px;display:grid;place-items:center;border:3px solid #ffd8a8}
.ytt .box{min-width:96px;height:58px;font-size:26px}
.wp{font-size:20px;font-weight:800;line-height:1.9;background:#f8f9ff;border-radius:18px;padding:12px}
.wp .emo{font-size:46px;display:block}
.act{display:inline-flex;flex-direction:column;align-items:center;background:#fff9db;border-radius:22px;padding:12px 20px;gap:6px}
.act .emo{font-size:70px}
.act b{font-size:21px}
/* feedback */
.fb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:#fff;border-radius:26px;padding:16px 28px;font-size:30px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:all .25s;z-index:20;white-space:nowrap}
.fb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fb.g{color:#2b8a3e;border:4px solid #51cf66}
.fb.b{color:#e8590c;border:4px solid #ffa94d}
/* end */
.endc{background:#fff;border-radius:30px;padding:30px 16px;text-align:center;margin-top:30px;border:4px solid var(--u);box-shadow:0 9px 0 rgba(0,0,0,.08)}
.endc .tr{font-size:90px;animation:bob 2s infinite}
.endc h2{font-size:22px;margin:6px 0;line-height:1.6}
.endc .es{font-size:34px;font-weight:900;margin:8px 0}
.endc p{font-size:21px;font-weight:800;margin:6px 0 20px}
.endc .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:30;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

<section id="home" class="screen on">

const nopt=(ans,min=0,max=9,k=3)=>near(ans,min,max,k).map(v=>({h:ar(v),k:v}));

const R={
 choice(q,c){c.insertAdjacentHTML('beforeend',`<div class="vis">${q.v||''}</div>`);c.appendChild(optsEl(q,c,q.o,q.a,q.lay))},

  c.insertAdjacentHTML('beforeend',`<div class="vis"><div class="bign">${ar(q.n)}</div></div>`);const w=el('div','shapes');
  for(let i=0;i<tot;i++){const s=el('button','shp');s.innerHTML=SHAPE[q.s];s.style.setProperty('--f',col);s.onclick=()=>{if(st.lock)return;s.classList.toggle('on');sfx('tap')};w.appendChild(s)}

 match(q,c){const n=q.pairs.length,wrap=el('div','mcols'),A=el('div','mcol'),Bc=el('div','mcol'),PAL=['#ffe3e3','#d3f9d8','#d0ebff','#fff3bf'];let sel=null,done=0;

 order(q,c){const exp=[...q.items].sort((x,y)=>x.v-y.v),sl=el('div','slots'+(q.col?' col':''));
  const ss=exp.map((_,i)=>{const s=el('div','slot');s.innerHTML=(q.col?`<b class="sl">${ar(i+1)}</b>`:'')+'<div class="sv"></div>';sl.appendChild(s);return s});
  c.appendChild(sl);let k=0;const pool=el('div','opts pool'+(q.col?' grid':''));
  shuf(q.items).forEach(it=>{const b=el('button','opt');b.innerHTML=it.h;b.onclick=()=>{if(st.lock)return;
   if(it.v===exp[k].v){ss[k].querySelector('.sv').innerHTML=it.h;ss[k].classList.add('full');b.style.display='none';k++;sfx('tap');if(k===exp.length)ok()}else no(b)};pool.appendChild(b)});c.appendChild(pool)},
 pick2(q,c){c.insertAdjacentHTML('beforeend',`<div class="vis">${eq('?','+','?','=',q.n)}</div>`);const w=el('div','opts');let sel=[];

    else{setTimeout(()=>{x.b.classList.remove('sel');y.b.classList.remove('sel')},400);no(x.b,y.b)}}};w.appendChild(b)});c.appendChild(w)},
 cross(q,c){c.insertAdjacentHTML('beforeend',`<div class="vis">${eq(q.n,'−',q.k,'=','?')}</div><div class="hint"></div>`);const h=c.querySelector('.hint'),g=el('div','xgrid');
  for(let i=0;i<q.n;i++){const s=el('button','xi');s.textContent=q.e;s.onclick=()=>{if(st.lock)return;s.classList.toggle('x');sfx('tap');upd()};g.appendChild(s)}
  c.appendChild(g);const w=optsEl(q,c,nopt(q.n-q.k),q.n-q.k);w.style.display='none';c.appendChild(w);

  for(let i=0;i<=10;i++){const t=el('button','tk');t.innerHTML=`<span class="fr"></span><span class="tl"></span><b>${ar(i)}</b>`;t.onclick=()=>{if(st.lock||done>=q.h)return;
   if(i===cur+1){cur=i;done++;place();sfx('hop');upd();if(done===q.h){fill(c,ar(cur));ok()}}else if(i!==cur)no(t)};T.push(t);L.appendChild(t)}
  c.appendChild(L);function place(){T.forEach(t=>t.querySelector('.fr').textContent='');T[cur].querySelector('.fr').textContent='🐸';T[cur].classList.add('vis2')}

/* ===== Unit 1: الأعداد ٠–٩ ===== */
function u1(){const Q=[];
 shuf(range(1,9)).slice(0,3).forEach(n=>Q.push({t:'choice',p:'عُدَّ الأشياء واختر العدد المناسب',v:group(n,pick(OBJ)),o:nopt(n),a:n}));
 {const n=rnd(2,9),e=pick(OBJ);Q.push({t:'choice',p:`ضع إصبعك على المجموعة التي فيها ${ar(n)} ${things(n)}`,o:near(n,1,9,3,2).map(x=>({h:group(x,e,'sm'),k:x})),a:n,lay:'grid'})}

 Q.push({t:'color',p:'لوّن بقدر العدد ثم اضغط تحقّق',n:pick([0,rnd(6,9)]),s:pick(Object.keys(SHAPE))});

 {const n=rnd(1,9);Q.push({t:'choice',p:`ما العدد السابق للعدد ${ar(n)}؟`,v:`<div class="eq">${B}${ar(n)}</div>`,o:nopt(n-1),a:n-1})}

 {const r=pick(['g','l','e']),a=r==='g'?rnd(0,7):r==='l'?rnd(2,9):rnd(1,9);let ans,bad;

 {const s=rnd(3,9),a=rnd(0,s);Q.push({t:'choice',p:'اختر العدد المناسب للمربع',v:eq(a,'+','?','=',s),o:PAD(),a:s-a,lay:'pad'})}

 {const used=new Set(),pr=[];while(pr.length<3){const a=rnd(0,8),b=rnd(0,9-a);const key=Math.min(a,b)+'-'+Math.max(a,b);if(a===b||used.has(key))continue;used.add(key);pr.push([eqs(a,'+',b),eqs(b,'+',a)])}
